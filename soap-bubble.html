<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soap Bubble</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A soap film stretched flat and clear over the dark, set trembling once and trembling forever: wherever its waves tilt it, it catches the light in the colours of thin films, and glares.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas {
    display: block; position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%); cursor: pointer;
  }
  #hint {
    position: fixed; left: 16px; bottom: 14px; max-width: calc(100vw - 172px); /* (clear of the sound button) */
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border-radius: 4px;
    transition: opacity 1.2s; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
  #spectrum { height: 6px; width: 180px; margin-bottom: 5px; border-radius: 2px; }
  #sounds { position: fixed; right: 16px; bottom: 14px; }
  #sounds button {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border: 0; border-radius: 4px; cursor: pointer;
    transition: opacity 1.2s; opacity: 1;
  }
  #sounds.dim button { opacity: .35; }
  #sounds button:hover, #sounds button:focus-visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><div id="spectrum"></div><div id="hintText"></div></div>
<div id="sounds"><button id="gurgle" type="button" aria-pressed="false">∘ gurgle: off</button></div>
<script src="pollock.js"></script>
<script src="soap-bubble.js"></script>
<script>
(() => {
  const PD = PollockDreams;
  const canvas = document.getElementById('c');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');
  const spectrum = document.getElementById('spectrum');
  const sounds = document.getElementById('sounds');
  const gurgleButton = document.getElementById('gurgle');

  const seed = (Math.random() * 1e9) | 0;
  const touch = matchMedia('(pointer: coarse)').matches;
  let CW, CH;

  // the film's colours: its optical thickness up to U_MAX nm, a table of
  // NU × NC (thickness × the cosine of the light's incidence)
  const U_MAX = 2400, NU = 512, NC = 32, N_FILM = 1.33;
  const colours = SoapBubble.filmColours(NU, NC, U_MAX, N_FILM);

  function setupCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    [CW, CH] = PD.canvasSize();
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    canvas.width = Math.round(CW * dpr);
    canvas.height = Math.round(CH * dpr);
  }

  // The light about the film, as it is seen reflected in it: in front, where
  // the viewer is, dark, so a flat film shows nothing; further round, a
  // soft light, brighter on one side; a few lamps, small and bright, the
  // glares; behind the film, the dark it hangs in. Directions are (x right,
  // y down, z towards the viewer).
  function lights(rng) {
    const lamps = [];
    const n = 3 + (rng() * 2 | 0);
    for (let k = 0; k < n; k++) {
      const th = (30 + rng() * 20) * Math.PI / 180, ph = rng() * PD.TAU;
      lamps.push([Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th), 60 + rng() * 80]);
    }
    return { lamps, side: rng() * PD.TAU };
  }

  // ---- drawing: WebGL2 ----
  function glPainter(gl, f, env) {
    function program(vs, fs) {
      const p = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, '#version 300 es\nprecision highp float;\n' + src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        gl.attachShader(p, s);
      }
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const loc = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); loc[name] = gl.getUniformLocation(p, name); }
      return { p, loc };
    }
    function texture(unit, wrap, internal, format, w, h, data) {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, t);
      for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, wrap], [gl.TEXTURE_WRAP_T, wrap]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
      gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, gl.FLOAT, data);
      return t;
    }
    const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
    const slopes = new Float32Array(f.NX * f.NY * 2);
    f.slope(slopes);
    const slopeTex = texture(0, gl.REPEAT, gl.RG16F, gl.RG, f.NX, f.NY, slopes);
    texture(1, gl.REPEAT, gl.R16F, gl.RED, f.NX, f.NY, f.thickness);
    texture(2, gl.CLAMP_TO_EDGE, gl.RGBA16F, gl.RGBA, NU, NC, colours);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const NL = env.lamps.length;
    const show = program(`in vec2 p; out vec2 uv; void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0, 1); }`,
      `in vec2 uv; out vec4 o;
      uniform sampler2D G, D, F; // the slope, the thickness at rest, the film's colours
      uniform vec2 N; // the grid
      uniform vec4 lamps[${NL}]; // which way, how bright
      uniform float side; // the way the soft light is brighter
      // the slope, smooth between the grid's points (a cubic B-spline, from
      // four bilinear lookups)
      vec2 slope(vec2 t) {
        vec2 p = t * N, i = floor(p), f = p - i, f2 = f * f, f3 = f2 * f;
        vec2 w0 = (1.0 - 3.0 * f + 3.0 * f2 - f3) / 6.0, w1 = (4.0 - 6.0 * f2 + 3.0 * f3) / 6.0;
        vec2 w2 = (1.0 + 3.0 * f + 3.0 * f2 - 3.0 * f3) / 6.0, w3 = f3 / 6.0;
        vec2 g0 = w0 + w1, g1 = w2 + w3;
        vec2 h0 = (i - 0.5 + w1 / g0) / N, h1 = (i + 1.5 + w3 / g1) / N;
        return g0.y * (g0.x * texture(G, h0).rg + g1.x * texture(G, vec2(h1.x, h0.y)).rg)
             + g1.y * (g0.x * texture(G, vec2(h0.x, h1.y)).rg + g1.x * texture(G, h1).rg);
      }
      vec3 light(vec3 r) {
        if (r.z <= 0.0) return vec3(0.0); // (the dark behind the film)
        float soft = smoothstep(0.97, 0.45, r.z) * (0.6 + 0.4 * cos(atan(r.y, r.x) - side)) * 3.0;
        float glare = 0.0;
        for (int k = 0; k < ${NL}; k++) glare += lamps[k].w * exp((dot(r, lamps[k].xyz) - 1.0) / 0.0005);
        return vec3(soft + glare) * smoothstep(0.0, 0.12, r.z);
      }
      void main() {
        vec2 t = vec2(uv.x, 1.0 - uv.y);
        vec2 g = slope(t);
        float c = inversesqrt(1.0 + dot(g, g)); // the cosine of its tilt, and of the light's incidence
        vec3 n = vec3(-g, 1.0) * c, r = vec3(0.0, 0.0, -1.0) + 2.0 * c * n;
        float d = texture(D, t + 0.5 / N).r * c; // (thinned as it is stretched)
        float ct = sqrt(1.0 - (1.0 - c * c) / ${(N_FILM * N_FILM).toFixed(4)});
        float u = ${N_FILM.toFixed(3)} * d * ct / ${U_MAX.toFixed(1)};
        vec3 R = max(texture(F, vec2((u * ${(NU - 1).toFixed(1)} + 0.5) / ${NU.toFixed(1)}, (c * ${(NC - 1).toFixed(1)} + 0.5) / ${NC.toFixed(1)})).rgb, 0.0);
        vec3 col = 1.0 - exp(-R * light(r));
        o = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
      }`);
    const a = gl.getAttribLocation(show.p, 'p');

    function draw() {
      f.slope(slopes);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, slopeTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, f.NX, f.NY, gl.RG, gl.FLOAT, slopes);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.useProgram(show.p);
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.enableVertexAttribArray(a);
      gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
      gl.uniform1i(show.loc.G, 0); gl.uniform1i(show.loc.D, 1); gl.uniform1i(show.loc.F, 2);
      gl.uniform2f(show.loc.N, f.NX, f.NY);
      gl.uniform4fv(show.loc.lamps, env.lamps.flat());
      gl.uniform1f(show.loc.side, env.side);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    return { draw, slopes };
  }

  // the film's colours, thin to thick, seen straight on, as a strip over the hint
  {
    const stops = [];
    for (let k = 0; k <= 60; k++) {
      const iu = Math.round(k / 60 * (NU - 1) * 1600 / U_MAX), o = ((NC - 1) * NU + iu) * 4;
      const c = [0, 1, 2].map(q => Math.round(255 * Math.pow(1 - Math.exp(-Math.max(0, colours[o + q]) * 8), 1 / 2.2)));
      stops.push(`rgb(${c}) ${(k / 60 * 100).toFixed(1)}%`);
    }
    spectrum.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
  }

  // ---- gurgling ----
  // A glare is born where the film, tilting, comes to catch a lamp where
  // nowhere near had caught it a moment before; each is heard as a bubble.
  // A bubble rings as it is born (Minnaert): a pure tone, dying away within
  // a few dozen of its cycles, rising a little as it does, the smaller the
  // bubble the higher; so the glare, by how sharply the film is curved
  // where it is born, the sharper the higher, and heard from where it is,
  // left or right. The glares come in runs as the waves pass, and the
  // bubbles with them: a gurgle.
  function glares(f, lamps) {
    const { NX, NY } = f, size = NX * NY, R = 2;
    // lit, as the shader draws a glare, to e^−2 of its peak; near lit, to e^−8
    const COS = 1 - 2 * 0.0005, NEAR = 1 - 8 * 0.0005;
    let lit = new Uint8Array(size), was = new Uint8Array(size);
    const seen = new Uint8Array(size), stack = new Int32Array(size), born = [];
    const at = (i, j) => ((j + NY) % NY) * NX + (i + NX) % NX;
    let first = true;
    return slopes => {
      [lit, was] = [was, lit];
      lit.fill(0);
      for (let n = 0; n < size; n++) {
        const gx = slopes[2 * n], gy = slopes[2 * n + 1], c2 = 1 / (1 + gx * gx + gy * gy);
        const rx = -2 * c2 * gx, ry = -2 * c2 * gy, rz = 2 * c2 - 1;
        for (let k = 0; k < lamps.length; k++) {
          const L = lamps[k], d = rx * L[0] + ry * L[1] + rz * L[2];
          if (d > NEAR) { lit[n] = (k + 1) | (d > COS ? 16 : 0); break; }
        }
      }
      // each glare (its points lit, together), new if none of them was near
      // lit by the same lamp a moment ago
      born.length = 0;
      seen.fill(0);
      for (let n0 = 0; n0 < size; n0++) {
        if (!(lit[n0] & 16) || seen[n0]) continue;
        const lamp = lit[n0] & 15;
        let top = 0, count = 0, old = false, si = 0, sj = 0, best = 0, bn = n0;
        stack[top++] = n0; seen[n0] = 1;
        while (top) {
          const n = stack[--top], i = n % NX, j = (n / NX) | 0;
          count++;
          // (its centre, across the seam too, from the first point)
          const i0 = n0 % NX, j0 = (n0 / NX) | 0;
          si += i - NX * Math.round((i - i0) / NX); sj += j - NY * Math.round((j - j0) / NY);
          if (!old) for (let dj = -R; dj <= R && !old; dj++) for (let di = -R; di <= R; di++) {
            if ((was[at(i + di, j + dj)] & 15) === lamp) { old = true; break; }
          }
          for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const m = at(i + di, j + dj);
            if (!seen[m] && (lit[m] & 16) && (lit[m] & 15) === lamp) { seen[m] = 1; stack[top++] = m; }
          }
        }
        if (old) continue;
        const ci = si / count, cj = sj / count, i = Math.round(ci), j = Math.round(cj);
        // the film's curvature there, ∇²h, from the slopes about it
        const curv = (slopes[2 * at(i + 1, j)] - slopes[2 * at(i - 1, j)]) * NX / (2 * f.Lx)
                   + (slopes[2 * at(i, j + 1) + 1] - slopes[2 * at(i, j - 1) + 1]) * NY / (2 * f.Ly);
        born.push({ x: ((ci / NX) % 1 + 1) % 1, y: ((cj / NY) % 1 + 1) % 1, curv: Math.abs(curv), size: count, lamp: lamp - 1 });
      }
      if (first) { first = false; born.length = 0; } // (all there at the start, none born)
      return born;
    };
  }

  // Off until asked for (browsers only let sound start from a click or a key
  // press); it waits while the painting is paused, as the film does.
  const Gurgle = (() => {
    let ac = null, out = null, on = false;
    function setup() {
      ac = new AudioContext();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -20; comp.ratio.value = 4;
      out = ac.createGain(); out.gain.value = 0.8;
      // a small wet room, from decaying noise
      const len = ac.sampleRate * 1.2, ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
      }
      const verb = ac.createConvolver(); verb.buffer = ir;
      const wet = ac.createGain(); wet.gain.value = 0.25;
      out.connect(comp); out.connect(verb); verb.connect(wet); wet.connect(comp);
      comp.connect(ac.destination);
    }
    // a bubble of pitch f0 Hz, as loud as loud, from pan (−1 left, 1 right), delay s from now
    function bubble(f0, loud, pan, delay = 0) {
      const t = ac.currentTime + 0.005 + delay;
      const d = 0.6 * (0.13 * f0 + 0.0072 * Math.pow(f0, 1.5)); // its damping, 1/s (after van den Doel)
      const life = 5 / d;
      const osc = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f0 * 1.6, t + life);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(loud, t + 0.003);
      g.gain.setTargetAtTime(0, t + 0.003, 1 / d);
      p.pan.value = pan;
      osc.connect(g); g.connect(p); p.connect(out);
      osc.start(t); osc.stop(t + life + 0.05);
    }
    // not more than a few at once: a run of many, only some heard
    let budget = 0, lastAt = 0;
    const RATE = 8, BURST = 5;
    return {
      set(o) {
        on = o;
        if (on && !ac) setup();
        if (ac) on ? ac.resume() : setTimeout(() => { if (!on) ac.suspend(); }, 400);
      },
      get on() { return on; },
      // the glares just born, each heard as a run of a few bubbles, one
      // after another, a glug (or told, as 'bubble' events, for whoever
      // records the painting with its sound): its pitch by the film's
      // curvature there, the bigger the glare, the more of them, and lower
      born(list, lamps) {
        const now = performance.now() / 1000;
        budget = Math.min(BURST, budget + (now - lastAt) * RATE); lastAt = now;
        for (const b of list) {
          if (budget < 1) break;
          budget -= 1;
          const base = Math.min(1100, Math.max(140, 320 * Math.pow(b.curv / 13, 0.7) / Math.pow(Math.max(1, b.size / 6), 0.25)));
          const runs = 1 + Math.floor(Math.random() * Math.min(4, 1.5 + b.size / 8));
          const loud = 0.12 * Math.min(1, lamps[b.lamp][3] / 140), pan = (b.x * 2 - 1) * 0.85;
          let dt = 0;
          for (let q = 0; q < runs; q++) {
            const f0 = base * (0.85 + 0.35 * Math.random()), l = loud * (0.55 + 0.45 * Math.random()) * Math.pow(0.8, q);
            dispatchEvent(new CustomEvent('bubble', { detail: { f0, loud: l, pan, delay: dt } }));
            if (on) bubble(f0, l, pan, dt);
            dt += 0.035 + Math.random() * 0.08;
          }
        }
      },
    };
  })();
  function setGurgle(o) {
    Gurgle.set(o);
    gurgleButton.textContent = `∘ gurgle: ${o ? 'on' : 'off'}`;
    gurgleButton.setAttribute('aria-pressed', o);
    showHint();
  }
  const toggleGurgle = () => setGurgle(!Gurgle.on);
  gurgleButton.addEventListener('click', toggleGurgle);

  let paused = false, film = null;
  function showStats() {
    if (!film) return;
    hintText.textContent = `waves ${film.modes}` + (paused ? ' · paused' : '') +
      (touch ? ` · tap: ${paused ? 'resume' : 'pause'}` : ` · thin ← colour → thick · click: ${paused ? 'resume' : 'pause'} · G: gurgle · S: save PNG`);
  }

  const awake = PD.screenAwake();
  canvas.addEventListener('click', () => {
    if (!film) return;
    paused = !paused;
    awake(!paused);
    showStats();
    showHint();
  });

  // One film per page load, trembling forever: only reloading the page
  // blows a new one.
  function start() {
    setupCanvas();
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true });
    if (!gl) { hintText.textContent = 'This painting needs WebGL2.'; return; }
    const rng = PD.mulberry32(seed);
    // the film as big whatever the screen's shape, as a 16:9 one's (16/9 × 1),
    // only its shape the screen's, so its waves look the same everywhere;
    // its grid the fewest cells (powers of two each way) no coarser than 1/128
    const aspect = CW / CH, Ly = Math.sqrt(16 / 9 / aspect), Lx = aspect * Ly;
    let NX = 32, NY = 32;
    while (Lx / NX > 1 / 128) NX *= 2;
    while (Ly / NY > 1 / 128) NY *= 2;
    const f = film = SoapBubble.film(rng, { Lx, Ly, NX, NY });
    window.film = f; // (for whoever wants to look inside)
    const env = lights(rng), painter = glPainter(gl, f, env), glaresBorn = glares(f, env.lamps);
    painter.draw();
    showStats();
    showHint();
    awake(true);
    let last;
    const frame = now => {
      const dt = Math.min(100, now - (last ?? now)) / 1000;
      last = now;
      if (!paused && dt > 0) {
        f.step(dt);
        painter.draw();
        Gurgle.born(glaresBorn(painter.slopes), env.lamps);
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  let lastMove = 0;
  window.addEventListener('mousemove', () => {
    const now = performance.now();
    if (now - lastMove > 500) { lastMove = now; showHint(); }
  });
  window.addEventListener('keydown', e => {
    if ((e.key === 'g' || e.key === 'G') && !e.repeat) toggleGurgle();
    if ((e.key === 's' || e.key === 'S') && film) {
      const a = document.createElement('a');
      a.download = `soap-bubble-${seed}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  });
  let ht;
  function showHint() {
    hint.classList.remove('hidden');
    sounds.classList.remove('dim');
    clearTimeout(ht);
    if (!paused) ht = setTimeout(() => { hint.classList.add('hidden'); sounds.classList.add('dim'); }, 4000);
  }

  start();
})();
</script>
</body>
</html>
