<style>

  canvas {

  }
  #hint {
    position: fixed; left: 16px; bottom: 14px; max-width: calc(100vw - 170px);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;

  }
  #hint.hidden { opacity: 0; }
  #swatches { display: flex; gap: 3px; margin-bottom: 5px; }
  #swatches span { width: 14px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(244,239,227,.35); }
  #sound {

  #sound.dim { opacity: .35; }
  #sound:hover, #sound:focus-visible { opacity: 1; }

<body>
<canvas id="c"></canvas>
<div id="hint"><div id="swatches"></div><div id="hintText"></div></div>
<button id="sound" type="button" aria-pressed="false">♪ music: off</button>
<script src="pollock.js"></script>
<script src="rect-music.js"></script>
<script>
(() => {
  const PD = PollockDreams, { TAU, rgba, jitter } = PD;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');
  const swatchBox = document.getElementById('swatches');
  const sound = document.getElementById('sound');

  const seed = (Math.random() * 1e9) | 0;
  let W, H;
  const touch = matchMedia('(pointer: coarse)').matches;

  // ---- colour: OKLCH, so lightness, chroma and hue match how colours look ----
  const DEG = Math.PI / 180;
  const gam = v => 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  function toLinear([L, A, B]) {
    const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3;
    const m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3;
    const s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
    return [4.0767416621 * l - 3.3077085724 * m + 0.2309667107 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  }
  const toRgb = lab => toLinear(lab).map(v => Math.max(0, Math.min(255, gam(Math.max(0, v)))));
  const lch = (L, C, h) => [L, C * Math.cos(h * DEG), C * Math.sin(h * DEG)];
  const hueOf = lab => (Math.atan2(lab[2], lab[1]) / DEG + 360) % 360;
  const chromaOf = lab => Math.hypot(lab[1], lab[2]);
  const hueDist = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
  const inGamut = lab => toLinear(lab).every(v => v >= -1e-4 && v <= 1 + 1e-4);
  // the colour at L and h with as much of chroma C as sRGB can show
  function fit(L, C, h) {
    if (inGamut(lch(L, C, h))) return lch(L, C, h);
    let lo = 0, hi = C;
    for (let i = 0; i < 14; i++) {
      const mid = (lo + hi) / 2;
      inGamut(lch(L, mid, h)) ? lo = mid : hi = mid;
    }
    return lch(L, lo, h);
  }

  // Classic harmonies: hue offsets from the key hue. The key hue itself is
  // listed more than once where it should dominate.
  const SCHEMES = [
    { name: 'analogous', hues: [0, 0, -30, 30] },
    { name: 'complementary', hues: [0, 0, 18, 180] },
    { name: 'split complementary', hues: [0, 0, 150, 210] },
    { name: 'triadic', hues: [0, 120, 240] },
    { name: 'monochrome', hues: [0, 0, 10] },
  ];
  const HUE_NAMES = [[0, 'rose'], [29, 'red'], [55, 'orange'], [80, 'ochre'], [105, 'yellow'], [125, 'lime'],
    [145, 'green'], [180, 'teal'], [205, 'cyan'], [240, 'azure'], [264, 'blue'], [290, 'violet'],
    [310, 'purple'], [335, 'magenta']];
  const hueName = h => HUE_NAMES.reduce((a, b) => hueDist(h, b[0]) < hueDist(h, a[0]) ? b : a)[1];

  // The colour mind: a key hue that keeps walking all the way round the
  // colour wheel, and a harmony around it that changes now and then. Every
  // new colour belongs to the current harmony, and colours in play that no
  // longer fit it are let go, so whatever is being poured right now always
  // goes together, while over time every hue gets its turn.
  function colourMind(rng) {
    const gauss = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(TAU * rng());
    const MAX_OTHERS = 5, FIT_DEG = 32;
    let key = rng() * 360, vel = (rng() < 0.5 ? -1 : 1) * (2 + rng() * 3); // degrees per new colour
    let scheme = SCHEMES[(rng() * SCHEMES.length) | 0], schemeLeft = 10 + (rng() * 14 | 0);
    let mood = rng(); // 0: muted, 1: rich
    const cur = { dark: null, light: null, others: [] };
    const all = () => [cur.dark, cur.light, ...cur.others].filter(Boolean);

    // greys and near-greys go with anything; a colour fits when its hue is
    // near one of the harmony's hues
    const fits = lab => chromaOf(lab) < 0.035 || scheme.hues.some(o => hueDist(hueOf(lab), key + o) < FIT_DEG);
    function step() {
      vel += gauss() * 0.7;
      if (rng() < 0.02) vel = -vel; // now and then the walk turns back
      vel = Math.sign(vel || 1) * Math.min(7, Math.max(1.5, Math.abs(vel)));
      key = (key + vel + 360) % 360;
      mood = Math.min(1, Math.max(0, mood + gauss() * 0.07));
      if (--schemeLeft <= 0) {
        scheme = SCHEMES.filter(s => s !== scheme)[(rng() * (SCHEMES.length - 1)) | 0];
        schemeLeft = 10 + (rng() * 14 | 0);
      }
      const keep = cur.others.filter(fits);
      cur.others = keep.length ? keep : cur.others.slice(-1);
    }
    function other() {
      const off = scheme.hues[(rng() * scheme.hues.length) | 0];
      const accent = Math.abs(off) > 40; // far from the key: lighter and quieter, so it sets off rather than fights
      const L = accent ? 0.62 + rng() * 0.2 : 0.42 + rng() * 0.42;
      const C = (0.05 + mood * 0.12) * (accent ? 0.7 : 1) * (0.75 + rng() * 0.5);
      return fit(L, C, key + off + gauss() * 6);
    }

    // the next colour for role: 'dark' | 'light' | 'other'
    function next(role) {
      step();
      if (role === 'dark') return cur.dark = fit(0.16 + rng() * 0.1, 0.015 + mood * 0.035, key + gauss() * 25);
      if (role === 'light') return cur.light = fit(0.9 + rng() * 0.06, 0.01 + rng() * 0.02, key + gauss() * 25);
      const lab = other();
      cur.others.push(lab);
      if (cur.others.length > MAX_OTHERS) cur.others.shift();
      return lab;
    }
    // a quiet ground, mostly a pale primed canvas, sometimes a dark one
    function ground() {
      return rng() < 0.75 ? fit(0.86 + rng() * 0.06, 0.015 + rng() * 0.025, key + 40 + gauss() * 30)
        : fit(0.22 + rng() * 0.06, 0.01 + rng() * 0.02, key + gauss() * 30);
    }
    function nearest() { return `${scheme.name} ${hueName(key)}`; }
    cur.dark = next('dark');
    cur.light = next('light');
    next('other');

    // a colour already in play for role
    function inPlay(role) {
      return role === 'dark' ? cur.dark : role === 'light' ? cur.light : cur.others[(rng() * cur.others.length) | 0];
    }
    return { next, inPlay, ground, nearest, palette: () => all().map(toRgb), others: () => cur.others };
  }

  // ---- painting ----
  const RECT_MS = 3000, FIRST_RECTS = 8, FIRST_RECT_MS = 1500, REST_MS = 400;

  function setupCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // Paint at the largest size the window can reach (the screen), so resizing
    // only reveals or crops the same image instead of repainting it.
    W = Math.max(screen.width, window.innerWidth);
    H = Math.max(screen.height, window.innerHeight);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  // Fractal rectangles, one after another forever, each in the next derived
  // colour, on a primed ground as in the finite painting.
  function painter(rng) {
    const eng = PD.engine(ctx, W, H);
    const mind = colourMind(rng);
    const gauss = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(TAU * rng());
    let n = 0;

    function ground(bg) {
      ctx.fillStyle = rgba(bg, 1);
      ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 26; i++) { // stains and uneven priming
        const x = rng() * W, y = rng() * H, r = (0.1 + rng() * 0.45) * Math.max(W, H);
        const c = jitter(bg, rng, 0.35);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(c, 0.06 + rng() * 0.08));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = eng.grainPattern(rng, false);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 0.05;
      ctx.fillStyle = eng.grainPattern(rng, true);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // ---- fractal rectangles ----
    // A rectangle is a fractal three ways over: its sizes follow a power law
    // (many small, a few nearly the whole canvas); it is split recursively, like
    // a Mondrian grown from one cut, the colour of every piece drifting from
    // its parent's by an amount that halves and halves again down the tree,
    // so the variation is self-similar at every scale; and every edge is a
    // midpoint-displacement line, rough like a brushed or torn edge, the
    // same roughness at every zoom. It is glazed on in thin sweeping coats.
    const sample = (min, max, a) => { // power law truncated to [min, max]
      const lo = min ** -a, hi = max ** -a;
      return (lo - rng() * (lo - hi)) ** (-1 / a);
    };
    const shade = (lab, dL) => [Math.min(0.97, Math.max(0.12, lab[0] + dL)), lab[1], lab[2]];

    function roughEdge(pts, x0, y0, x1, y1, amp) {
      const len = Math.hypot(x1 - x0, y1 - y0);
      if (len < 7) { pts.push(x1, y1); return; }
      const d = gauss() * amp;
      const mx = (x0 + x1) / 2 + (y0 - y1) / len * d, my = (y0 + y1) / 2 + (x1 - x0) / len * d;
      roughEdge(pts, x0, y0, mx, my, amp * 0.6); // 0.6 ≈ 2^-0.74: a Hurst exponent of ~0.74
      roughEdge(pts, mx, my, x1, y1, amp * 0.6);
    }
    function roughRect(x, y, w, h, rough) {
      const pts = [x, y], a = l => rough * (0.6 + 0.004 * l);
      roughEdge(pts, x, y, x + w, y, a(w));
      roughEdge(pts, x + w, y, x + w, y + h, a(h));
      roughEdge(pts, x + w, y + h, x, y + h, a(w));
      roughEdge(pts, x, y + h, x, y, a(h));
      ctx.beginPath();
      ctx.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
      ctx.closePath();
    }

    // dry-brush streaks along the piece, so a glazed field isn't flat
    function brushwork(l) {
      const along = l.w >= l.h, len = along ? l.w : l.h, across = along ? l.h : l.w;
      const k = Math.min(14, 2 + (l.w * l.h / 5000) | 0);
      ctx.lineCap = 'butt';
      for (let i = 0; i < k; i++) {
        const c = toRgb(shade(l.lab, gauss() * 0.06)), t = rng() * across, bow = gauss() * across * 0.04;
        ctx.strokeStyle = rgba(c, 0.08 + rng() * 0.1);
        ctx.lineWidth = 1 + rng() * Math.min(14, across * 0.12);
        const s = rng() * 0.3 * len, e = len - rng() * 0.3 * len;
        ctx.beginPath();
        if (along) { ctx.moveTo(l.x + s, l.y + t); ctx.quadraticCurveTo(l.x + (s + e) / 2, l.y + t + bow, l.x + e, l.y + t + gauss()); }
        else { ctx.moveTo(l.x + t, l.y + s); ctx.quadraticCurveTo(l.x + t + bow, l.y + (s + e) / 2, l.x + t + gauss(), l.y + e); }
        ctx.stroke();
      }
      ctx.lineCap = 'round';
    }

    // a smaller rectangle floated inside a piece, sitting a little low,
    // as in Albers' squares; it may hold one more
    function nest(x, y, w, h, lab, depth) {
      const s = 0.5 + rng() * 0.25, iw = w * s, ih = h * s;
      const ix = x + (w - iw) / 2, iy = y + (h - ih) * (0.55 + rng() * 0.25);
      const inner = rng() < 0.5 ? mind.inPlay('other') : shade(lab, (rng() < 0.5 ? -1 : 1) * (0.1 + rng() * 0.08));
      for (let k = 0; k < 2; k++) {
        roughRect(ix + gauss(), iy + gauss(), iw, ih, 0.8);
        ctx.fillStyle = rgba(jitter(toRgb(inner), rng, 0.03), 0.5);
        ctx.fill();
      }
      if (depth < 2 && Math.min(iw, ih) > 50 && rng() < 0.5) nest(ix, iy, iw, ih, inner, depth + 1);
    }

    function rectangleLayer(colour) {
      const area = sample(0.044, 0.89, 0.9) * W * H, aspect = Math.exp((rng() * 2 - 1) * 0.9);
      let w = Math.min(0.94 * W, Math.sqrt(area * aspect)), h = Math.min(0.94 * H, area / w);
      w = Math.min(0.94 * W, area / h);
      // up to 30% of a rectangle may hang off the canvas, so the borders fill too
      const cx = 0.2 * w + rng() * (W - 0.4 * w), cy = 0.2 * h + rng() * (H - 0.4 * h), rot = gauss() * 0.02;

      const leaves = [];
      (function split(x, y, w, h, d, lab) {
        const big = Math.max(w, h);
        const go = d < 8 && big > 48 && (d < 2 && big > 220 || rng() < 0.8 * 0.86 ** d);
        if (!go) {
          // a few pieces are left out, Sierpinski-wise, and the painting shows through
          if (d < 2 || rng() > 0.08) leaves.push({ x, y, w, h, lab });
          return;
        }
        const vertical = w > h * 1.25 || (h <= w * 1.25 && rng() < 0.5);
        const t = Math.min(0.8, Math.max(0.2, [0.382, 0.5, 0.618][(rng() * 3) | 0] + gauss() * 0.04));
        const s = 0.62 ** (d + 1);
        const child = () => rng() < 0.1 ? mind.inPlay('other')
          : [Math.min(0.95, Math.max(0.15, lab[0] + gauss() * 0.09 * s)), lab[1] + gauss() * 0.02 * s, lab[2] + gauss() * 0.02 * s];
        if (vertical) { split(x, y, w * t, h, d + 1, child()); split(x + w * t, y, w * (1 - t), h, d + 1, child()); }
        else { split(x, y, w, h * t, d + 1, child()); split(x, y + h * t, w, h * (1 - t), d + 1, child()); }
      })(-w / 2, -h / 2, w, h, 0, colour);

      // the coats sweep across the rectangle from one side
      const dir = rng() * TAU, gap = 1 + rng() * 4, ALPHAS = [0.3, 0.4, 0.55];
      leaves.sort((a, b) => (a.x + a.w / 2) * Math.cos(dir) + (a.y + a.h / 2) * Math.sin(dir)
        - (b.x + b.w / 2) * Math.cos(dir) - (b.y + b.h / 2) * Math.sin(dir));
      for (const l of leaves) { l.x += gap / 2; l.y += gap / 2; l.w -= gap; l.h -= gap; l.nest = Math.min(l.w, l.h) > 80 && rng() < 0.18; }
      const jobs = [];
      ALPHAS.forEach((alpha, k) => {
        const last = k === ALPHAS.length - 1;
        for (const l of leaves) jobs.push(() => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          const j = last ? 0.5 : 1.5; // earlier coats wander a little: soft edges
          roughRect(l.x + gauss() * j, l.y + gauss() * j, l.w, l.h, last ? 1 : 1.6);
          ctx.fillStyle = rgba(jitter(toRgb(l.lab), rng, 0.025), alpha);
          ctx.fill();
          if (last) {
            ctx.clip();
            brushwork(l);
            if (l.nest) nest(l.x, l.y, l.w, l.h, l.lab, 0);
          }
          ctx.restore();
        });
      });
      return jobs;
    }

    // Next layer: the next rectangle. Most are in a new colour of the
    // harmony; now and then one is in its tinted dark or light, for weight
    // and air. The first few come quicker, so the canvas isn't bare for long.
    //
    // Photosensitive epilepsy (under 3 flashes a second): a spot changes only
    // with each coat (three per rectangle, see ALPHAS), and between rectangles there
    // is a REST_MS pause, so a dark rectangle and a light one never land on
    // the same spot within 1/3 s. Keep FIRST_RECT_MS / 3 and REST_MS
    // well above 1/3 s.
    function nextLayer() {
      const r = rng(), role = r < 0.14 ? 'dark' : r < 0.26 ? 'light' : 'other';
      const ms = n++ < FIRST_RECTS ? FIRST_RECT_MS : RECT_MS;
      const jobs = rectangleLayer(mind.next(role));
      const rest = Math.ceil(jobs.length * REST_MS / ms);
      for (let i = 0; i < rest; i++) jobs.push(() => {});
      return { jobs, ms: ms + REST_MS };
    }

    const bg = toRgb(mind.ground());
    return { bg, ground: () => ground(bg), nextLayer, mind };
  }

  function showPalette(p) {
    swatchBox.replaceChildren(...p.mind.palette().map(c => {
      const s = document.createElement('span');
      s.style.background = rgba(c, 1);
      return s;
    }));
    hintText.textContent = (touch ? '' : 'colours: ') + p.mind.nearest() +
      (paused ? ' · paused' : '') +
      (touch ? ` · tap: ${paused ? 'resume' : 'pause'}` : ` · click: ${paused ? 'resume' : 'pause'} · M: music · S: save PNG`);
  }

  // Click / tap pauses and resumes the pouring; while paused the hint stays up.
  let paused = false, painting;
  canvas.addEventListener('click', () => {
    paused = !paused;
    syncMusic();
    showPalette(painting);
    showHint();
  });

  // Ambient fractal music (rect-music.js), off until asked for: browsers only let
  // sound start from a click or a key press. It pauses with the painting.
  const music = RectMusic.player(seed);
  let musicOn = false;
  const syncMusic = () => musicOn && !paused ? music.play() : music.stop();
  function toggleMusic() {
    musicOn = !musicOn;
    syncMusic();
    sound.textContent = `♪ music: ${musicOn ? 'on' : 'off'}`;
    sound.setAttribute('aria-pressed', musicOn);
    showHint();
  }
  sound.addEventListener('click', toggleMusic);

  // One painting per page load: it is never restarted, only reloading the
  // page begins a new one.
  function start() {
    setupCanvas();
    const p = painting = painter(PD.mulberry32(seed));
    document.body.style.background = rgba(p.bg, 1);
    p.ground();
    let layer = p.nextLayer(), i = 0, credit = 0, last;
    showPalette(p);
    showHint();
    // Jobs are released at the current layer's pace; time spent in a hidden
    // tab, or while paused, doesn't pile up into a burst when it comes back.
    const frame = now => {
      const dt = Math.min(100, now - (last ?? now));
      last = now;
      if (paused) { requestAnimationFrame(frame); return; }
      credit += dt * layer.jobs.length / layer.ms;
      const f0 = performance.now();
      while (credit >= 1 && performance.now() - f0 < 14) {
        layer.jobs[i++]();
        credit--;
        if (i === layer.jobs.length) {
          layer = p.nextLayer(); i = 0;
          credit = Math.min(credit, 1);
          showPalette(p);
        }
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // the hint (with the colours in play) comes back while the mouse moves
  let lastMove = 0;
  window.addEventListener('mousemove', () => {
    const now = performance.now();
    if (now - lastMove > 500) { lastMove = now; showHint(); }
  });
  window.addEventListener('keydown', e => {
    if ((e.key === 'm' || e.key === 'M') && !e.repeat) toggleMusic();
    if (e.key === 's' || e.key === 'S') {
      const a = document.createElement('a');
      a.download = `pollock-rectangles-${seed}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  });
  let ht;
  function showHint() {
    hint.classList.remove('hidden');
    sound.classList.remove('dim');
    clearTimeout(ht);
    if (!paused) ht = setTimeout(() => { hint.classList.add('hidden'); sound.classList.add('dim'); }, 4000);
  }

  start();
})();
</script>
