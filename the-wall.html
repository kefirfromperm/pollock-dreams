<script>
(() => {
  const PD = PollockDreams, { TAU, rgba } = PD;
  const { toRgb, fit, hueName } = Colours;
  const canvas = document.getElementById('c');
  const over = document.getElementById('f');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');
  const swatchBox = document.getElementById('swatches');
  const sounds = document.getElementById('sounds');
  const sound = document.getElementById('sound');
  const windButton = document.getElementById('wind');

  const seed = (Math.random() * 1e9) | 0;
  // the canvas (CW × CH css px, CPW × CPH device px) and the screen (VW × VH)
  let CW, CH, VW, VH, CPW, CPH;
  const touch = matchMedia('(pointer: coarse)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- the wall ----
  // An old wall, painted over and over again: under every coat lies another.
  // Now the top coat cracks as it shrinks, in cracks that run across the
  // stress in it and into one another, the coat under it showing in them,
  // the plates between them cracking again as it grows; and a little bit of
  // paint the cracks ring in comes loose, and a gust blows it away.
  //
  // The wall is a grid of cells, each knowing which coat is on top there (its
  // depth: 0 is the newest coat, deeper ones older), how far it has cracked
  // and how far its paint cups up beside a crack.
  //
  // Sizes are fractions of the screen, √(VW·VH) (U), so the wall looks the
  // same on any screen; the paint's thickness is in css px, as real paint's
  // would be.
  const MAX_CELLS = 1.6e6; // cells of at least 1 css px, not many more than this
  // The coat, drying in the air, would shrink; but stuck fast to the coat
  // under it, it can't: it is stretched, the same every way, the more the
  // longer it has been bared, by SHRINK0 + (seconds since)/SHRINK_T (of its
  // strength, as that is on average). Its strength fluctuates, by STRONG on
  // scales of about JAG css px, RELAX U and PATCH U, so it cracks
  // irregularly. A crack lets the paint either side of it shrink across it:
  // at its lips nothing is left of the stress across it, and that comes back
  // about RELAX U from it (as e^(−d/RELAX)); along it the paint is stretched
  // as ever. (Nothing else lets it shrink: the coat goes on for ever beyond
  // the wall's edge and under the coat above, and is as stretched round a
  // hole in it as anywhere.)
  // A crack begins where the greatest stress is more than the strength there,
  // the more readily the more it is (NUCLEATE a second, per U² of paint, per
  // unit more), across that stress, running both ways. At its tip the paint
  // is weaker, TIP of its strength: it runs on at CRACK_SPEED U a second,
  // the way the stress across it is the most over that, a little way ahead,
  // a turn off its course costing STIFF·turn², its course following the way
  // it goes over STRAIGHT U (so the paint's fluctuations make it jagged, but
  // hardly bend it, and the stress, turning it the same way step after step,
  // does); it slows as that is less, and stops where it
  // is nowhere over it, to run on when the stress has grown enough; or it
  // ends where it meets another crack or the edge of its coat. Where it
  // turns sharply, more than BEND in BEND_LEN css px, the paint on the
  // outside of the turn is weaker too, BEND_WEAK of its strength: a crack
  // may set off from there into it.
  // As the stress grows, plates ringed in by cracks crack again, across, down
  // to about 1.4·RELAX wide, where hardly any stress is left in them.
  const CRACK_SPEED = [0.03, 0.08], CRACK_WIDTH = [0.8, 1.6], MAX_TIPS = 250; // css px
  const SHRINK0 = 0.7, SHRINK_T = 40, RELAX = 0.018, NUCLEATE = 6;
  const STRONG = [0.15, 0.15, 0.2], JAG = 4, PATCH = 0.15;
  // The first crack begins by FIRST seconds, wherever the paint is weakest.
  const FIRST = 0.5;
  const TIP = 0.55, STIFF = 0.4, STRAIGHT = 0.03, BEND = 0.7, BEND_LEN = 8, BEND_WEAK = 0.6;
  // A bit of paint ringed in by cracks, of area a up to FRAG (U²), comes loose;
  // one with little or none of its coat left round it (open, 0–1), up to
  // FRAG·(1 + (ISLAND − 1)·open^1.5): a free edge lets go of the wall.
  // A gust (puff p, see the wind) blows it off at
  // BLOW·m·(p − PUFF_BLOW)²·e^(−rise/RISE)·ease·(FRAG_REF/a)^(1 − open/2)
  // a second: in a gust well begun, the more, the stronger it is, and hardly
  // while it is still rising fast (rise, its strength's rate, 1/s), so the
  // bits go about its peak, its sound heard swelling before; the smaller,
  // the more readily, and the more open (ease, OPEN times as much for a bit
  // all open as for one hemmed in all round), the less its size matters, the
  // wind getting under its free edge. m is its coat's pace, kept so that the
  // coat loses half of what is left of it every HALF seconds from when it
  // first begins to come off.
  const FRAG = 0.003, FRAG_REF = 0.0002, BLOW = 1700, PUFF_BLOW = 0.1, RISE = 0.1, HALF = 60, ISLAND = 8, OPEN = 12;
  // the paint: its highest lift (as LIFT, to scale the rest), a crack's
  // groove and how far the paint cups up beside it, css px
  const LIT_FPS = 30;
  const LIFT = 4, GROOVE = 0.7, CUP = 0.2, CUP_WIDTH = 1.8, BRUSH = 0.18;
  const LIGHT = (() => { const v = [-0.6, -0.7, 0.62], l = Math.hypot(...v); return v.map(c => c / l); })(); // y down

  // The canvas is as canvasSize gives it: on a touch device a square as wide
  // as the screen's long side, so turning it leaves no margins.
  function setupCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    [CW, CH, VW, VH] = PD.canvasSize();
    for (const c of [canvas, over]) {
      c.style.width = CW + 'px';
      c.style.height = CH + 'px';
      c.width = Math.round(CW * dpr);
      c.height = Math.round(CH * dpr);
    }
    CPW = canvas.width; CPH = canvas.height;
  }

  // ---- colour ----
  // Every coat was a new start, in one of the paints walls are painted in
  // (OKLCH: how often, L ± dL, C ± dC, h ± dh), the years having dulled it,
  // and never the same paint as the coat it covered, nor one hard to tell
  // from it.
  const PAINTS = [
    [3, 0.93, 0.03, 0.012, 0.01, 90, 30], // whitewash, off-white
    [2, 0.89, 0.03, 0.04, 0.015, 92, 10], // cream, ivory
    [2, 0.8, 0.05, 0.085, 0.025, 84, 10], // ochre, yellow distemper
    [2, 0.78, 0.06, 0.06, 0.02, 155, 20], // pale green, the hospital's and the school's
    [1, 0.5, 0.06, 0.065, 0.02, 162, 14], // deep green
    [2, 0.79, 0.06, 0.05, 0.02, 232, 14], // pale blue
    [1, 0.46, 0.06, 0.07, 0.02, 252, 10], // deep blue
    [1, 0.72, 0.05, 0.06, 0.02, 198, 12], // turquoise
    [1.5, 0.56, 0.05, 0.1, 0.025, 38, 9], // terracotta, brick red
    [1, 0.8, 0.04, 0.05, 0.02, 35, 14], // dusty pink, salmon
    [1, 0.47, 0.05, 0.05, 0.02, 60, 12], // brown
    [1, 0.7, 0.1, 0.01, 0.008, 250, 60], // grey
    [0.6, 0.75, 0.04, 0.045, 0.015, 305, 15], // lilac
  ];
  function coats(rng) {
    const gauss = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(TAU * rng());
    const lab = [], rgb = [];
    const hueDist = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
    const all = PAINTS.reduce((s, p) => s + p[0], 0);
    let prev = null;
    function make() {
      let c;
      for (let i = 0; i < 30; i++) {
        let r = rng() * all, kind = 0;
        while ((r -= PAINTS[kind][0]) > 0) kind++;
        const [, L, dL, C, dC, h, dh] = PAINTS[kind], u = () => 2 * rng() - 1;
        c = { kind, L: L + dL * u(), C: Math.max(0.004, C + dC * u()), h: h + dh * u() };
        if (!prev) break;
        const grey = Math.min(c.C, prev.C) < 0.035;
        if (kind !== prev.kind && (Math.abs(c.L - prev.L) > 0.1 || (!grey && hueDist(c.h, prev.h) > 55))) break;
      }
      prev = c;
      const l = fit(c.L, c.C, c.h + gauss() * 2);
      lab.push(l);
      rgb.push(toRgb(l));
    }
    return {
      // the colour of coat k (depth), made as far down as it is asked for
      rgb(k) { while (rgb.length <= k) make(); return rgb[k]; },
      lab(k) { while (lab.length <= k) make(); return lab[k]; },
      count: () => rgb.length,
    };
  }

  // ---- the wind ----
  // One wind over the whole wall: a slowly changing breeze, its heading
  // drifting round, and gusts that come, swell and die away (sometimes a few
  // at once), turning the wind a little as they pass; and some turbulence.
  // speed is about 0.3 in a breeze, over 1 in a strong gust. A gust comes
  // every 0.5–2 s. They overlap, so the wind seldom falls low; what blows
  // the bits off, and is heard, is the wind rising over its lull (lull:
  // following the wind down within LULL[0] s, up only over LULL[1] s) by
  // more than PUFF_MIN: puff, about 0–1, 0 about half the time. So a gust
  // swells and dies away even in a strong wind, and in between it is quiet.
  const LULL = [0.8, 3], PUFF_MIN = 0.2;
  function windModel(rng) {
    const gauss = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(TAU * rng());
    const ou = (v, mean, tau, sigma, dt) => { const e = Math.exp(-dt / tau); return mean + (v - mean) * e + sigma * Math.sqrt(1 - e * e) * gauss(); };
    let mean = rng() * TAU, heading = mean, breeze = 0.25, turb = 0, gusts = [], next = 0.5 + rng() * 1.5;
    let lull = null;
    const w = { speed: 0.25, gust: 0, rise: 0, puff: 0, dir: heading };
    w.step = dt => {
      mean += gauss() * 0.1 * Math.sqrt(dt);
      heading += (mean - heading) * Math.min(1, dt / 12) + gauss() * 0.1 * Math.sqrt(dt);
      breeze = ou(breeze, 0.28, 30, 0.12, dt);
      turb = ou(turb, 0, 0.6, 1, dt);
      if ((next -= dt) <= 0) {
        gusts.push({ t: 0, rise: 0.8 + rng() * 2.2, fall: 2 + rng() * 5, a: 0.25 + Math.pow(rng(), 1.5) * 1.1, turn: gauss() * 0.35 });
        next = 0.5 + rng() * 1.5; // one every 0.5–2 s
      }
      let g = 0, turn = 0;
      gusts = gusts.filter(q => (q.t += dt) < q.rise + q.fall);
      for (const q of gusts) {
        const e = q.t < q.rise ? 0.5 - 0.5 * Math.cos(Math.PI * q.t / q.rise) : 0.5 + 0.5 * Math.cos(Math.PI * (q.t - q.rise) / q.fall);
        g += q.a * e; turn += q.turn * e;
      }
      if (dt > 0) w.rise = (g - w.gust) / dt; // (the gusts' rising, smooth: not the turbulence)
      w.gust = g;
      w.speed = Math.max(0.04, Math.max(0.06, breeze) + g + 0.07 * turb * (0.6 + g));
      w.dir = heading + turn;
      if (lull === null) lull = w.speed;
      lull += (w.speed - lull) * (1 - Math.exp(-dt / LULL[w.speed < lull ? 0 : 1]));
      w.puff = Math.max(0, w.speed - lull - PUFF_MIN);
    };
    return w;
  }

  // ---- drawing: WebGL2 ----
  const VERT = `#version 300 es
in vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;
  // The wall, lit by a raking light from the upper left. Coats meet flat
  // along the smoothed borders of their cells, each with brush strokes and
  // dirt and scuffs of its own; the paint is grooved and cupped where it
  // cracks.
  const WALL = `#version 300 es
precision highp float;
precision highp int;
precision highp usampler2D;
uniform usampler2D depth; // the coat on top, mod 256
uniform sampler2D crack, lift, palette;
uniform vec2 grid, cellPx; // grid cells, device px per cell
uniform float cellCss, viewH, unit, wallSeed; // css px per cell, the canvas's height in device px, U in css px, 0–1000
uniform float liftMax, groove, brushH, shadowStep, aa, fine; // fine: 0–1, how much a crack is drawn as on a phone
uniform vec3 light; // towards the light, y down
out vec4 o;
int dAt(ivec2 c) { return int(texelFetch(depth, clamp(c, ivec2(0), ivec2(grid) - 1), 0).r); }
// a coat's depth from ref's, wrapped (only a few coats ever show at once)
float rel(int d, int ref) { return float(((d - ref + 128) & 255) - 128); }
vec3 paintOf(int k) { return texelFetch(palette, ivec2(k & 255, 0), 0).rgb; }
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }
// the wall's height at q (cells), css px
float heightAt(vec2 q) {
  vec2 uv = q / grid;
  return liftMax * texture(lift, uv).r - groove * texture(crack, uv).r;
}
// The coats on the 4×4 cells round q, relative to ref, with Gaussian
// weights: a smooth field of them, so their borders run in smooth curves
// rather than along the cells.
const float SIGMA = 0.6;
void around(vec2 q, int ref, out float r[16], out float w[16]) {
  vec2 b = floor(q - 0.5) - 1.0;
  float ws = 0.0;
  for (int k = 0; k < 16; k++) {
    vec2 c = b + vec2(k % 4, k / 4), d = q - c - 0.5;
    r[k] = rel(dAt(ivec2(c)), ref);
    w[k] = exp(-dot(d, d) / (2.0 * SIGMA * SIGMA));
    ws += w[k];
  }
  for (int k = 0; k < 16; k++) w[k] /= ws;
}
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
vec4 hash4(vec2 p) {
  vec4 p4 = fract(vec4(p.xyxy) * vec4(0.1031, 0.1030, 0.0973, 0.1099));
  p4 += dot(p4, p4.wzxy + 33.33);
  return fract((p4.xxyz + p4.yzzw) * p4.zywx);
}
// A coat's scuffs at u (U), coat id: in a square SC U across, now and then
// one, an arc a few hundredths of U long, bowed a little, mostly lying near
// level (things carried along the wall, chairs pushed back against it,
// shoes), a few any way; broken along its way where it was pressed less, and
// striated along it. Dark where something rubbed off onto the paint, pale
// where it scraped the paint (and, where it dug in, through it); or a soft
// smudge of dirt rubbed on by hand. x: how dark, y: how scraped.
const float SC = 0.12;
vec2 scuffs(vec2 u, float id) {
  vec2 cell = floor(u / SC), s = vec2(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = cell + vec2(i, j);
    vec4 h = hash4(c + vec2(id * 37.0, id * 17.0 + 5.0));
    if (h.x > 0.21) continue;
    vec4 e = hash4(c.yx * 1.37 + vec2(id * 11.0 + 91.0, 7.0)), f = hash4(c * 0.71 + vec2(13.0, id * 29.0 + 3.0));
    // dark < 0.55 < scrape < 0.8 < smudge; the smudges the commonest of all
    float kind = h.x < 0.12 ? 0.8 * h.z : 0.8 + 0.2 * h.z;
    float ang = f.x < 0.75 ? (h.y - 0.5) * 0.9 : h.y * 3.14159;
    vec2 dir = vec2(cos(ang), sin(ang)), d = u - (c + e.xy) * SC;
    float x = dot(d, dir), len = SC * (kind < 0.8 ? 0.12 + 0.4 * h.w : 0.2 + 0.35 * h.w);
    if (abs(x) > len) continue;
    // (hard where it began, trailing off, its width wavering, a rubbed one's
    // edges ragged; a scrape a bundle of straight scratches)
    float t = (f.w < 0.5 ? x : -x) / len, y = dot(d, vec2(-dir.y, dir.x)) - (e.w - 0.5) * 0.25 * len * t * t;
    float wid = kind < 0.55 ? 0.002 + 0.005 * e.z : kind < 0.8 ? 0.0015 + 0.004 * e.z : 0.007 + 0.012 * e.z;
    wid *= 0.6 + 0.8 * vnoise(vec2(x * 60.0, f.x * 40.0));
    if (kind < 0.55) y += wid * 0.5 * (vnoise(vec2(x * 90.0, 0.0) + f.zw * 70.0) - 0.5);
    float a = y / (wid * smoothstep(-1.0, -0.75, t) + 1e-5), prof = exp(-2.0 * a * a * a * a);
    if (prof < 0.01) continue;
    float fade = 1.0 - smoothstep(-0.6, 1.0, t);
    float press = smoothstep(0.2, 0.5, vnoise(vec2(x * 90.0, id + 7.0 * f.y))) * (0.5 + 0.5 * f.z) * fade;
    float lines = vnoise(vec2(x * 25.0, y * 900.0) + 100.0 * f.yw);
    if (kind < 0.55) s.x += prof * press * mix(0.7, 1.0, lines) * 1.1;
    else if (kind < 0.8) s.y += prof * press * smoothstep(0.3, 0.75, lines) * 1.4;
    else s.x += 0.3 * exp(-a * a) * (1.0 - t * t) * (1.0 - t * t) * (0.5 + 0.5 * vnoise(u * 160.0 + f.xy * 50.0)) * (0.5 + 0.5 * f.z);
  }
  return min(s, 1.0);
}
// The years' dirt on coat k (linear colour c, the coat under it under) at
// p (css px), u (U): what it gathered while it was the top coat, and kept
// once painted over. Each coat got dirty in its own way, some more than
// others: grime in faint soft blotches, a fly speck here and there; and its
// scuffs.
vec3 aged(vec3 c, vec3 under, vec2 p, vec2 u, int k) {
  float id = float(k & 255) + wallSeed;
  vec4 h = hash4(vec2(id, 41.0) + 0.37);
  vec2 o = h.xy * 100.0;
  float dirty = 0.5 + h.z;
  float g = 0.5 * vnoise(u * 4.0 + o) + 0.3 * vnoise(u * 13.0 + o.yx) + 0.2 * vnoise(u * 45.0 + o + 7.0);
  float grime = 0.15 + smoothstep(0.35, 0.8, g);
  // (a film of dust: darker than pale paint, paler than dark)
  c = mix(c, vec3(0.2, 0.17, 0.13), 0.06 * dirty * grime);
  vec2 sp = p / 6.0, sc = floor(sp);
  vec4 fs = hash4(sc + o);
  if (fs.x < 0.0012 * dirty) {
    float r = length(sp - sc - 0.25 - 0.5 * fs.yz) * 6.0, rad = 0.5 + 0.8 * fs.w;
    c *= 1.0 - 0.6 * smoothstep(rad, 0.4 * rad, r);
  }
  vec2 sf = scuffs(u, id);
  c = mix(c, vec3(0.025, 0.024, 0.026), 0.6 * sf.x);
  c = mix(c, mix(c, vec3(0.72, 0.7, 0.66), 0.45), 0.8 * min(sf.y, 1.0));
  return mix(c, under * 0.6, 0.5 * smoothstep(0.75, 1.0, sf.y));
}
vec3 coatAt(int k, vec2 p, vec2 u) { return aged(lin(paintOf(k)), lin(paintOf(k + 1)), p, u, k); }
// a coat's brushwork, at p (css px): strokes along the coat's own direction
float brush(vec2 p, int k) {
  float id = float(k & 255), a = hash(vec2(id, 7.0)) * 3.14159;

    const pace = new Map();
    let paceDue = 0;
    function pacing(dt) {
      if ((paceDue -= dt) > 0) return;
      paceDue = 0.5;
      const count = new Map(), stride = Math.max(1, Math.floor(N / 20000)) | 1;
      let n = 0, lo = Infinity, hi = -Infinity;
      for (let i = 0; i < N; i += stride, n++) { const k = dep[i]; count.set(k, (count.get(k) ?? 0) + 1); lo = Math.min(lo, k); hi = Math.max(hi, k); }
      let under = 0; // share of the wall deeper than k
      for (let k = hi; k >= lo; k--) {
        const lost = under / (under + (count.get(k) ?? 0));
        under += count.get(k) ?? 0;
        let p = pace.get(k);
        if (!p) { if (!lost) continue; p = { m: 1, t0: clock }; pace.set(k, p); }
        const should = 1 - Math.pow(0.5, (clock - p.t0) / HALF);
        p.m = clamp(p.m * Math.exp(2 * (should - lost)), 0.05, 1000);
      }
      for (const k of pace.keys()) if (k < lo) pace.delete(k);
    }

    // ---- flying ----
    // A bit blown off flies as it was cut out of the wall, its back (the same
    // paint, chalkier, a little of the coat it lay on stuck to it) and a soft
    // shadow with it. The wind carries it, pulling it along the faster the
    // smaller it is, and gravity; it flutters across its path, spins and
    // tumbles, showing one side and the other in turn, and drifts out
    // towards the viewer, its shadow falling further from it on the wall.
    const flying = [];
    const WIND = 1.5, GRAVITY = 0.15, LIFE = [0.5, 1]; // U a second per unit of wind; U/s²; s, fading out at the end
    const dpr = CPW / CW; // device px per css px
    const PAD = 2; // device px round a sprite
    const sheet = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    // Bit b off the wall: cut out of the canvas as it shows now (only right
    // after it was shown: it can't be read later), and the coat under it,
    // and the cracks round it, bared.
    function blowOff(b, wind) {
      // (only what is still its coat's, and loose: the wall may have changed
      // under it since it came loose)
      const { k } = b, cells = b.cells.filter(i => dep[i] === k && loose[i]);
      if (cells.length < 4) {
        const at = [];
        for (const i of b.cells) if (dep[i] === k) { loose[i] = 0; at.push(i % GW + 0.5, ((i / GW) | 0) + 0.5); }
        ringed(at, k); // (what is left of it may be a fleck now)
        strays(b.bx0 - 4, b.by0 - 4, b.bx1 + 4, b.by1 + 4, k);
        return;
      }
      let bx0 = GW, by0 = GH, bx1 = 0, by1 = 0;
      for (const i of cells) { const x = i % GW, y = (i / GW) | 0; bx0 = Math.min(bx0, x); bx1 = Math.max(bx1, x); by0 = Math.min(by0, y); by1 = Math.max(by1, y); }
      const w = bx1 - bx0 + 1, h = by1 - by0 + 1, inside = new Uint8Array(w * h);
      for (const i of cells) inside[(((i / GW) | 0) - by0) * w + i % GW - bx0] = 1;
      const small = sheet(w, h), mc = small.getContext('2d'), img = mc.createImageData(w, h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { // edges softened by a 3×3 box
        if (!inside[y * w + x]) continue;
        let m = 0;
        for (let v = Math.max(0, y - 1); v <= Math.min(h - 1, y + 1); v++)
          for (let u = Math.max(0, x - 1); u <= Math.min(w - 1, x + 1); u++) m += inside[v * w + u];
        img.data[4 * (y * w + x) + 3] = Math.min(255, 255 * m / 6);
      }
      mc.putImageData(img, 0, 0);
      const sw = Math.ceil(w * pxX) + 2 * PAD, sh = Math.ceil(h * pxY) + 2 * PAD, ox = Math.round(bx0 * pxX) - PAD, oy = Math.round(by0 * pxY) - PAD;
      const tinted = rgb => {
        const c = sheet(sw, sh), x = c.getContext('2d');
        x.imageSmoothingEnabled = true;
        x.drawImage(small, PAD, PAD, w * pxX, h * pxY);
        x.globalCompositeOperation = 'source-in';
        x.fillStyle = rgba(rgb, 1);
        x.fillRect(0, 0, sw, sh);
        return c;
      };
      const faceRgb = colours.rgb(k), under = colours.rgb(k + 1);
      const back = tinted(faceRgb.map((v, i) => 0.65 * v + 0.2 * [236, 231, 222][i] + 0.15 * under[i])), dark = tinted([0, 0, 0]);
      const face = sheet(sw, sh), fx = face.getContext('2d');
      const sx0 = Math.max(0, ox), sy0 = Math.max(0, oy), sx1 = Math.min(CPW, ox + sw), sy1 = Math.min(CPH, oy + sh);
      if (sx1 > sx0 && sy1 > sy0) fx.putImageData(g.read(sx0, sy0, sx1 - sx0, sy1 - sy0), sx0 - ox, sy0 - oy);
      fx.globalCompositeOperation = 'destination-in';
      fx.drawImage(dark, 0, 0);
      // off the wall
      const take = i => { dep[i] = k + 1; bared[i] = clock; depth[i] = (k + 1) & 255; crack[i] = 0; split[i] = 0; lift[i] = 0; loose[i] = 0; };
      for (const i of cells) {
        take(i);
        const x = i % GW, y = (i / GW) | 0;
        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
          if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
          const n = ny * GW + nx;
          if (dep[n] === k && split[n]) take(n);
        }
      }
      // the paint round it now ends at its rim, not at a crack; and the rim
      // may close a ring round a bit beside it
      const rim = [];
      for (let y = Math.max(1, by0 - 2); y <= Math.min(GH - 2, by1 + 2); y++)
        for (let x = Math.max(1, bx0 - 2); x <= Math.min(GW - 2, bx1 + 2); x++) {
          const i = y * GW + x;
          if (dep[i] === k && (dep[i - 1] > k || dep[i + 1] > k || dep[i - GW] > k || dep[i + GW] > k)) {
            crack[i] = 0; split[i] = 0; lift[i] = 0;
            rim.push(x + 0.5, y + 0.5);
          }
        }
      touched(bx0 - 2, by0 - 2, bx1 + 2, by1 + 2);
      ringed(rim, k);
      strays(bx0 - 4, by0 - 4, bx1 + 4, by1 + 4, k);
      if (k + 1 > deepest) { deepest = k + 1; paletteUp(); }
      // and away, the way the gust blows
      const blur = Math.max(1, 2.5 * pxX), sp = Math.ceil(2 * blur), off = sw + 4 * sp + 10;
      const shadow = sheet(sw + 2 * sp, sh + 2 * sp), sx = shadow.getContext('2d');
      sx.shadowColor = 'rgba(0,0,0,1)'; sx.shadowBlur = blur; sx.shadowOffsetX = off;
      sx.drawImage(dark, sp - off, sp);
      const s = Math.sqrt(cells.length / Math.PI) * cellCss / U, kw = 2.2 / (0.6 + s / 0.02); // how fast the wind takes it, 1/s
      const go = 0.15 * U * (0.5 + rng()), dir = wind.dir + gauss() * 0.4;
      flying.push({ face, back, dark, shadow, sp, k: kw,
        x: ox + sw / 2, y: oy + sh / 2, // device px
        vx: Math.cos(dir) * go, vy: Math.sin(dir) * go, // css px/s
        z: 0, vz: 0.15 + 0.2 * rng(), life: LIFE[0] + rng() * (LIFE[1] - LIFE[0]), // towards the viewer, U; s
        axis: rng() * TAU, spin: 0, spinV: gauss() * 1.5, tumble: 0, tumbleV: (rng() < 0.5 ? -1 : 1) * (1 + rng() * 3),
        flutter: rng() * TAU, flutterHz: 0.6 + rng() * 1.5, age: 0 });
      snaps.push({ size: s, pan: clamp(((bx0 + bx1) / 2 / GW * CW - CW / 2) / (innerWidth / 2), -1, 1) });
    }
    function fly(p, dt, wind) {
      p.age += dt;
      const ws = wind.speed * WIND * U, wx = Math.cos(wind.dir) * ws, wy = Math.sin(wind.dir) * ws;
      const sp = Math.hypot(p.vx, p.vy) + 1e-6;
      p.flutter += TAU * p.flutterHz * dt;
      const fl = Math.sin(p.flutter) * 0.04 * U * (0.3 + wind.speed); // across its path
      p.vx += ((wx - p.vx) * p.k + (-p.vy / sp) * fl) * dt;
      p.vy += ((wy - p.vy) * p.k + (p.vx / sp) * fl + GRAVITY * U) * dt;
      p.x += p.vx * dt * dpr; p.y += p.vy * dt * dpr;
      p.vz *= Math.exp(-dt / 3);
      p.z += p.vz * dt;
      p.spin += p.spinV * (0.4 + wind.speed) * dt;
      p.tumble += p.tumbleV * (0.4 + wind.speed) * dt;
      const m = Math.max(p.face.width, p.face.height) * (1 + p.z);
      return p.age < p.life && p.x > -m && p.y > -m && p.x < CPW + m && p.y < CPH + m;
    }
    // the bits flying, shadows first
    const octx = over.getContext('2d');
    function drawFlying() {
      octx.setTransform(1, 0, 0, 1, 0, 0);
      octx.clearRect(0, 0, over.width, over.height);
      for (const pass of [0, 1]) for (const p of flying) {
        const sc = 1 + p.z, ct = Math.cos(p.tumble), fade = clamp((p.life - p.age) / 0.3, 0, 1);
        const sx = Math.max(0.15, Math.abs(ct)), turn = p.axis + p.spin;
        if (pass === 0) { // the shadow on the wall, the further the softer
          const d = p.z * 0.25 * U * dpr;
          octx.setTransform(1, 0, 0, 1, p.x - LIGHT[0] / LIGHT[2] * d, p.y - LIGHT[1] / LIGHT[2] * d);
          octx.rotate(turn);
          octx.scale(sx * (1 + 0.6 * p.z), 1 + 0.6 * p.z);
          octx.rotate(-p.axis);
          octx.globalAlpha = 0.25 * fade / (1 + 3 * p.z);
          octx.drawImage(p.shadow, -p.shadow.width / 2, -p.shadow.height / 2);
          continue;
        }
        octx.setTransform(1, 0, 0, 1, p.x, p.y);
        octx.rotate(turn);
        octx.scale(sx * sc, sc);
        octx.rotate(-p.axis);
        // lit as a tilted sheet: its normal leans across the tumbling axis
        const st = Math.sin(p.tumble), cs = Math.cos(turn), sn = Math.sin(turn);
        let nx = st * cs, ny = st * sn, nz = ct;
        if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
        const lit = 0.5 + 0.5 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / LIGHT[2];
        octx.globalAlpha = fade;
        octx.drawImage(ct >= 0 ? p.face : p.back, -p.face.width / 2, -p.face.height / 2);
        if (lit < 1) {
          octx.globalAlpha = fade * Math.min(0.5, 1 - lit);
          octx.drawImage(p.dark, -p.face.width / 2, -p.face.height / 2);
        }
      }
      octx.setTransform(1, 0, 0, 1, 0, 0);
      octx.globalAlpha = 1;
    }

    // ---- the wall as it is ----
    const wind = windModel(rng);
    let clock = 0;
    let wasFlying = false, litAt = -Infinity;

    // the coats showing, from the top: [depth, share of the wall]
    function showing() {
      const count = new Map(), stride = Math.max(1, Math.floor(N / 20000)) | 1;
      let n = 0;
      for (let i = 0; i < N; i += stride, n++) count.set(dep[i], (count.get(dep[i]) ?? 0) + 1);
      return [...count].map(([k, c]) => [k, c / n]).filter(([, s]) => s > 0.002).sort((a, b) => a[0] - b[0]);
    }

    return {
      bg: colours.rgb(0), colours, showing,
      // the wall as shown, as ImageData
      picture: () => g.read(0, 0, CPW, CPH),
      // a frame dt real seconds long; tells what the wind and the paint did
      advance(dt) {
        clock += dt;
        wind.step(dt);
        cracked = 0; crackX = 0;
        const blown = snaps;
        snaps = [];
        // new cracks where the stress has grown over the paint's strength
        begin(dt);
        wake();
        for (let n = tips.length; n--;) if (!grow(tips[n], dt)) tips.splice(n, 1);
        gusts(dt, wind);
        for (let n = flying.length; n--;) if (!fly(flying[n], dt, wind)) flying.splice(n, 1);
        const pan = x => clamp((x / GW * CW - CW / 2) / (innerWidth / 2), -1, 1);
        return { dt, wind: { speed: wind.speed, puff: wind.puff, dir: wind.dir }, crack: cracked,
          crackPan: cracked ? pan(crackX / cracked) : 0, snaps: blown };
      },
      // the wall lit anew where it has changed (or all of it), and the bits flying
      draw(all = false) {
        if (all) dirty.fill(1);
        let changed = false;
        // the wall is lit at most LIT_FPS times a second (the bits fly at
        // every frame): it changes slowly, and lighting is the costly part
        const now = performance.now(), lighting = all || now - litAt >= 1000 / LIT_FPS - 2;
        if (lighting) litAt = now;
        // each row of tiles, in runs of dirty ones: all of them up first, then
        // lit (a tile's light reads the cells round it, in the tiles beside it,
        // which must be as they are now, or a seam of the old wall stays)
        const runs = [];
        if (lighting) for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw;) {
          if (!dirty[ty * tw + tx]) { tx++; continue; }
          const from = tx;
          while (tx < tw && dirty[ty * tw + tx]) dirty[ty * tw + tx++] = 0;
          const x0 = from * TILE, x1 = Math.min(GW, tx * TILE) - 1, y0 = ty * TILE, y1 = Math.min(GH, y0 + TILE) - 1;
          g.upload(x0, y0, x1, y1);
          runs.push([x0, y0, x1, y1]);
        }
        for (const [x0, y0, x1, y1] of runs)
          g.light(Math.floor(x0 * pxX), Math.floor(y0 * pxY), Math.min(CPW - 1, Math.ceil((x1 + 1) * pxX) - 1), Math.min(CPH - 1, Math.ceil((y1 + 1) * pxY) - 1), cellCss, U);
        changed = runs.length > 0;
        // the canvas keeps showing what it showed when nothing was drawn;
        // bits blown off are cut out of it as it shows
        if (changed || all || blowing.length) g.show();
        for (const b of blowing) blowOff(b, wind);
        blowing.length = 0;
        if (flying.length || wasFlying || all) drawFlying();
        wasFlying = flying.length > 0;
      },
    };
  }

  // the colours showing, and how deep they go
  function showCoats(p) {
    const s = p.showing();
    swatchBox.replaceChildren(...s.map(([k]) => {
      const el = document.createElement('span');
      el.style.background = rgba(p.colours.rgb(k), 1);
      return el;
    }));
    const lo = s[0][0] + 1, hi = s[s.length - 1][0] + 1;
    hintText.textContent = (lo === hi ? `coat ${lo}` : `coats ${lo}–${hi}`) + ' of ∞' +
      (paused ? ' · paused' : '') +
      (touch ? ` · tap: ${paused ? 'resume' : 'pause'}` : ` · click: ${paused ? 'resume' : 'pause'} · M: music · W: wind · S: save PNG`);
  }

  // Click / tap pauses and resumes the wall; while paused the hint stays up.
  // The screen is kept awake while it goes on, as for a video.
  let paused = false, painting;
  const awake = PD.screenAwake();
  canvas.addEventListener('click', () => {
    if (!painting) return;
    paused = !paused;
    awake(!paused);
    syncSound();
    showCoats(painting);
    showHint();
  });

  // Music (wall-music.js), off until asked for: browsers only let sound start
  // from a click or a key press. It pauses with the wall.
  // The wind switch: the wind that blows the bits off, told every frame as
  // a wall event (so a recording can listen in too), and the cracking and
  // the bits, which crackle. The music: a lament far off, on a big low
  // horn and a muffled drum, carried nearer by the gusts. The wind can be
  // heard on its own, without the music, but the music never goes without
  // it: turning the music on turns the wind on, and turning the wind off
  // turns the music off.
  const music = WallMusic.player(seed);
  addEventListener('wall', e => music.hear(e.detail));
  let musicOn = false, windOn = false;
  const syncSound = () => (musicOn || windOn) && !paused ? music.play(musicOn) : music.stop();
  function setSound(m, w) {
    musicOn = m; windOn = w || m;
    syncSound();
    sound.textContent = `♪ music: ${musicOn ? 'on' : 'off'}`;
    sound.setAttribute('aria-pressed', musicOn);
    windButton.textContent = `∘ wind: ${windOn ? 'on' : 'off'}`;
    windButton.setAttribute('aria-pressed', windOn);
    showHint();
  }
  const toggleMusic = () => setSound(!musicOn, windOn);
  const toggleWind = () => setSound(musicOn && !windOn, !windOn);
  sound.addEventListener('click', toggleMusic);
  windButton.addEventListener('click', toggleWind);

  // The wall and the bits flying before it, as one picture.
  function snapshot() {
    painting.draw(true);
    const c = document.createElement('canvas');
    c.width = CPW; c.height = CPH;
    const x = c.getContext('2d');
    x.putImageData(painting.picture(), 0, 0); // (read from GL, not copied off the canvas)
    x.drawImage(over, 0, 0);
    return c;
  }
  window.snapshot = snapshot;

  // The PNG tagged as sRGB (the canvas's colours are), so that viewers show
  // it in the colours the page shows, not stretched to a wide-gamut screen:
  // an sRGB chunk put in after the header.
  async function tagSrgb(blob) {
    const png = new Uint8Array(await blob.arrayBuffer());
    const crc = bytes => {
      let c = ~0;
      for (const b of bytes) { c ^= b; for (let k = 0; k < 8; k++) c = c >>> 1 ^ (0xEDB88320 & -(c & 1)); }
      return ~c >>> 0;
    };
    const body = new Uint8Array([0x73, 0x52, 0x47, 0x42, 0]); // 'sRGB', perceptual
    const chunk = new Uint8Array(4 + body.length + 4), v = new DataView(chunk.buffer);
    v.setUint32(0, 1); chunk.set(body, 4); v.setUint32(4 + body.length, crc(body));
    const at = 8 + 8 + 13 + 4; // signature, then the header chunk
    return new Blob([png.subarray(0, at), chunk, png.subarray(at)], { type: 'image/png' });
  }

  // One wall per page load: it is never restarted, only reloading the page
  // begins a new one.
  function start() {
    setupCanvas();
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
    if (!gl) { hintText.textContent = 'This painting needs WebGL2.'; return; }
    const most = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    if (Math.max(CPW, CPH) > most) {
      const fit = most / Math.max(CPW, CPH);
      for (const c of [canvas, over]) { c.width = Math.floor(c.width * fit); c.height = Math.floor(c.height * fit); }
      CPW = canvas.width; CPH = canvas.height;
    }
    const p = painting = painter(gl, PD.mulberry32(seed));
    document.body.style.background = rgba(p.bg, 1);
    p.draw(true);
    showCoats(p);
    showHint();
    awake(true);
    let last, coatsAt = 0;
    // time spent in a hidden tab, or while paused, doesn't pile up into a
    // burst when it comes back
    const frame = now => {
      const dt = Math.min(100, now - (last ?? now)) / 1000;
      last = now;
      if (!paused) {
        dispatchEvent(new CustomEvent('wall', { detail: p.advance(dt) }));
        p.draw();
        if (now - coatsAt > 1000) { coatsAt = now; showCoats(p); }
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // the hint (with the colours showing) comes back while the mouse moves
  let lastMove = 0;
  window.addEventListener('mousemove', () => {
    const now = performance.now();
    if (now - lastMove > 500) { lastMove = now; showHint(); }
  });
  window.addEventListener('keydown', e => {
    if ((e.key === 'm' || e.key === 'M') && !e.repeat) toggleMusic();
    if ((e.key === 'w' || e.key === 'W') && !e.repeat) toggleWind();
    if ((e.key === 's' || e.key === 'S') && painting) {
      snapshot().toBlob(async blob => {
        const a = document.createElement('a');
        a.download = `the-wall-${seed}.png`;
        a.href = URL.createObjectURL(await tagSrgb(blob));
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      }, 'image/png');
    }
  });
  let ht;
  function showHint() {
    hint.classList.remove('hidden');
    sounds.classList.remove('dim');
    clearTimeout(ht);
    if (!paused) ht = setTimeout(() => { hint.classList.add('hidden'); sounds.classList.add('dim'); }, 4000);
  }

  start();
})();
</script>
</body>
