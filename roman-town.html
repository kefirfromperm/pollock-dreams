<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8J2V3WVJ2Z"></script>
<script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-8J2V3WVJ2Z');

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Town</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A small Roman town laid out at random and seen from straight above, north up, lit by the sun or the moon as they stand by your clock: its walls and gates, forum, baths and theatre, houses round their atria, the tombs along the roads out, the fields and olive groves, the hills and the river.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1915; }
  canvas {
    display: block; position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%); cursor: grab; touch-action: none;
  }
  #hint {
    position: fixed; left: 16px; bottom: 14px; max-width: calc(100vw - 32px);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border-radius: 4px;
    transition: opacity 1.2s; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<script src="pollock.js"></script>
<script src="roman-town.js"></script>
<script src="roman-town-view.js"></script>
<script src="roman-town-sky.js"></script>
<script>
(() => {
  const PD = PollockDreams;
  const canvas = document.getElementById('c');
  const hint = document.getElementById('hint');
  const touch = matchMedia('(pointer: coarse)').matches;
  const fixed = new URLSearchParams(location.search).get('seed');
  const seed = fixed !== null ? +fixed : (Math.random() * 1e9) | 0;

  // One town per page load. The world is as big whatever the screen's shape,
  // as a 16:9 one's 820 × 461 m, only its shape the screen's.
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const [CW, CH] = PD.canvasSize();
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';
  const DW = canvas.width = Math.round(CW * dpr), DH = canvas.height = Math.round(CH * dpr);
  const aspect = CW / CH, W = Math.sqrt(820 * 461 * aspect), H = W / aspect;
  const rng = PD.mulberry32(seed);
  const town = RomanTown.town(rng, { W, H });
  window.town = town; // (for whoever wants to look inside)
  const opts = { seed };

  // ---- the hour: north up, the sun and the moon where they stand now by the
  // visitor's clock (or at ?time=2026-06-21T19:30), the light following them ----
  const at = new URLSearchParams(location.search).get('time');
  const clock = () => at ? new Date(at) : new Date();
  let sky = RomanTownSky.local(clock());
  setInterval(() => {
    const next = RomanTownSky.local(clock()), deg = Math.PI / 180;
    const moved = Math.abs(next.sun.el - sky.sun.el) > 0.05 * deg || Math.abs(next.sun.az - sky.sun.az) > 0.05 * deg
      || Math.abs(next.moon.el - sky.moon.el) > 0.05 * deg;
    if (moved) { sky = next; dirty = true; }
  }, 10000);

  // ---- the view: the whole world at zoom 1, up to 32 times closer ----
  const ZMAX = 32, sFit = DW / W; // device px a metre at zoom 1
  let zoom = 1, cx = W / 2, cy = H / 2;
  const scale = () => sFit * zoom;
  // the canvas, centred, may be bigger than the window: what is seen of it
  const seenPx = () => [Math.min(DW, innerWidth * dpr), Math.min(DH, innerHeight * dpr)];
  // the world a rectangle: what is seen of it kept inside it
  function clampView() {
    zoom = Math.min(ZMAX, Math.max(1, zoom));
    const [sw, sh] = seenPx(), hx = sw / 2 / scale(), hy = sh / 2 / scale();
    cx = hx * 2 >= W ? W / 2 : Math.min(W - hx, Math.max(hx, cx));
    cy = hy * 2 >= H ? H / 2 : Math.min(H - hy, Math.max(hy, cy));
  }
  // the canvas's rectangle of the world, and the part of it seen
  const viewRect = () => { const vw = DW / scale(), vh = DH / scale(); return [cx - vw / 2, cy - vh / 2, vw, vh]; };
  const seenRect = () => { const [sw, sh] = seenPx(), vw = sw / scale(), vh = sh / scale(); return [cx - vw / 2, cy - vh / 2, vw, vh]; };
  function zoomAt(px, py, f) {
    const [vx, vy] = viewRect(), wx = vx + px / scale(), wy = vy + py / scale();
    zoom = Math.min(ZMAX, Math.max(1, zoom * f));
    cx = wx - px / scale() + DW / scale() / 2;
    cy = wy - py / scale() + DH / scale() / 2;
    clampView();
    changed();
  }
  function pan(dx, dy) { cx -= dx / scale(); cy -= dy / scale(); clampView(); changed(); }
  window.addEventListener('resize', () => { clampView(); changed(); });

  // ---- the view: the town drawn by the graphics card, whenever anything changed ----
  let view = null, dirty = true, started = false;
  try { view = RomanTownView.create(canvas, town, opts); }
  catch (e) { hint.textContent = e.message; }
  function changed() { dirty = true; }
  function loop() {
    if (dirty && view) {
      dirty = false;
      view.draw(viewRect(), sky);
      if (!started) {
        started = true;
        const t = clock(), hm = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
        hint.textContent = `town ${seed} · ${hm}, north up · ` + (touch ? 'drag: move · pinch: zoom' : 'drag or arrows: move · wheel or + −: zoom · 0: all · S: save PNG');
        showHint();
      }
    }
    requestAnimationFrame(loop);
  }

  // ---- moving about ----
  const devicePt = e => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * DW / r.width, (e.clientY - r.top) * DH / r.height];
  };
  const pointers = new Map();
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, devicePt(e));
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const p = devicePt(e);
    if (pointers.size === 1) {
      const q = pointers.get(e.pointerId);
      pan(p[0] - q[0], p[1] - q[1]);
    } else if (pointers.size === 2) {
      // a pinch: the zoom by how far apart the fingers are, about between them
      const [a, b] = [...pointers.values()], other = pointers.get(e.pointerId) === a ? b : a;
      const before = Math.hypot(a[0] - b[0], a[1] - b[1]), after = Math.hypot(p[0] - other[0], p[1] - other[1]);
      const q = pointers.get(e.pointerId);
      pan((p[0] - q[0]) / 2, (p[1] - q[1]) / 2);
      if (before > 10) zoomAt((p[0] + other[0]) / 2, (p[1] + other[1]) / 2, after / before);
    }
    pointers.set(e.pointerId, p);
  });
  const up = e => { pointers.delete(e.pointerId); if (!pointers.size) canvas.style.cursor = ''; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('dblclick', e => zoomAt(...devicePt(e), 2));
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    zoomAt(...devicePt(e), Math.exp(-d * 0.0018));
  }, { passive: false });

  let lastMove = 0;
  window.addEventListener('mousemove', () => {
    const now = performance.now();
    if (now - lastMove > 500) { lastMove = now; showHint(); }
  });
  window.addEventListener('keydown', e => {
    // the screen's middle is the canvas's (it may be cropped on a phone)
    const step = Math.min(innerWidth, innerHeight) * dpr * 0.25;
    switch (e.key) {
      case 'ArrowLeft': pan(step, 0); break;
      case 'ArrowRight': pan(-step, 0); break;
      case 'ArrowUp': pan(0, step); break;
      case 'ArrowDown': pan(0, -step); break;
      case '+': case '=': zoomAt(DW / 2, DH / 2, 1.5); break;
      case '-': case '_': zoomAt(DW / 2, DH / 2, 1 / 1.5); break;
      case '0': zoom = 1; cx = W / 2; cy = H / 2; changed(); break;
      case 's': case 'S': {
        const a = document.createElement('a');
        a.download = `roman-town-${seed}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        break;
      }
      default: return;
    }
    e.preventDefault();
  });
  let ht;
  function showHint() {
    hint.classList.remove('hidden');
    clearTimeout(ht);
    ht = setTimeout(() => hint.classList.add('hidden'), started ? 4000 : 60000);
  }

  if (view) { hint.textContent = 'laying out a town…'; showHint(); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
