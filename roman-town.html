<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Town</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A small Roman town laid out at random and seen from straight above, north up, lit by the sun or the moon as they stand by your clock: its walls and gates, forum, baths and theatre, houses round their atria, the tombs along the roads out, the fields and olive groves, the hills and the river; and its people, each at their trade, eating when hungry and sleeping when tired, the whole town off to the theatre or the games on a feast day, the shepherds moving their flocks from pasture to pasture, pigs in their mud, all of it to be heard as well as seen, about whatever the hour of the Roman day has them about, on and on.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1915; }
  canvas {
    display: block; position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%); cursor: grab; touch-action: none;
  }
  #hint {
    position: fixed; left: 16px; bottom: 14px; max-width: calc(100vw - 170px);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border-radius: 4px;
    transition: opacity 1.2s; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
  #who {
    position: fixed; left: 0; top: 0; max-width: 300px; pointer-events: none;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.7);
    padding: 5px 9px; border-radius: 4px; display: none; white-space: normal;
  }
  #who b { font-weight: 600; color: #fff8e6; }
  #sound {
    position: fixed; right: 16px; bottom: 14px;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border: 0; border-radius: 4px; cursor: pointer;
  }
  #who i { font-style: normal; color: #e6c98e; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="who"></div>
<button id="sound" type="button" aria-pressed="false">♪ sound: off</button>
<script src="pollock.js"></script>
<script src="roman-town.js"></script>
<script src="roman-town-view.js"></script>
<script src="roman-town-sky.js"></script>
<script src="roman-town-life.js"></script>
<script src="roman-town-sound.js"></script>
<script>
(() => {
  const PD = PollockDreams;
  const canvas = document.getElementById('c');
  const hint = document.getElementById('hint');
  const touch = matchMedia('(pointer: coarse)').matches;
  const fixed = new URLSearchParams(location.search).get('seed');
  const seed = fixed !== null ? +fixed : (Math.random() * 1e9) | 0;

  // One town per page load, on a square of land 820 m a side, the same
  // whatever the screen (a seed the same town on any); zoomed right out it
  // covers the screen edge to edge, the rest of it there to be dragged into view.
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const [CW, CH] = PD.canvasSize();
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';
  const DW = canvas.width = Math.round(CW * dpr), DH = canvas.height = Math.round(CH * dpr);
  const W = 820, H = 820;
  const rng = PD.mulberry32(seed);
  const town = RomanTown.town(rng, { W, H });
  window.town = town; // (for whoever wants to look inside)
  const opts = { seed };

  // ---- the hour: north up, the sun and the moon where they stand now by the
  // visitor's clock (or at ?time=2026-06-21T19:30), the light following them ----
  // (a time given runs on from there as the page does)
  const at = new URLSearchParams(location.search).get('time');
  let clockT = 0;
  const clock = () => at ? new Date(new Date(at).getTime() + clockT * 1000) : new Date();
  let sky = RomanTownSky.local(clock());
  setInterval(() => {
    const next = RomanTownSky.local(clock()), deg = Math.PI / 180;
    const moved = Math.abs(next.sun.el - sky.sun.el) > 0.05 * deg || Math.abs(next.sun.az - sky.sun.az) > 0.05 * deg
      || Math.abs(next.moon.el - sky.moon.el) > 0.05 * deg;
    if (moved) sky = next;
  }, 10000);

  // ---- the view: the whole world at zoom 1, up to 64 times closer (a person a hand's breadth) ----
  const ZMAX = 64, sFit = Math.max(DW / W, DH / H); // device px a metre at zoom 1: the land covering the screen
  let zoom = 1, cx = W / 2, cy = H / 2;
  const scale = () => sFit * zoom;
  // the canvas, centred, may be bigger than the window: what is seen of it
  const seenPx = () => [Math.min(DW, innerWidth * dpr), Math.min(DH, innerHeight * dpr)];
  // the world a rectangle: what is seen of it kept inside it
  function clampView() {
    zoom = Math.min(ZMAX, Math.max(1, zoom));
    const [sw, sh] = seenPx(), hx = sw / 2 / scale(), hy = sh / 2 / scale();
    cx = hx * 2 >= W ? W / 2 : Math.min(W - hx, Math.max(hx, cx));
    cy = hy * 2 >= H ? H / 2 : Math.min(H - hy, Math.max(hy, cy));
  }
  // the canvas's rectangle of the world, and the part of it seen
  const viewRect = () => { const vw = DW / scale(), vh = DH / scale(); return [cx - vw / 2, cy - vh / 2, vw, vh]; };
  const seenRect = () => { const [sw, sh] = seenPx(), vw = sw / scale(), vh = sh / scale(); return [cx - vw / 2, cy - vh / 2, vw, vh]; };
  function zoomAt(px, py, f) {
    const [vx, vy] = viewRect(), wx = vx + px / scale(), wy = vy + py / scale();
    zoom = Math.min(ZMAX, Math.max(1, zoom * f));
    cx = wx - px / scale() + DW / scale() / 2;
    cy = wy - py / scale() + DH / scale() / 2;
    clampView();
    changed();
  }
  function pan(dx, dy) { cx -= dx / scale(); cy -= dy / scale(); clampView(); changed(); }
  window.addEventListener('resize', () => { clampView(); changed(); });

  // ---- the view: the town drawn by the graphics card, whenever anything changed ----
  let view = null, dirty = true, started = false;
  try { view = RomanTownView.create(canvas, town, opts); }
  catch (e) { hint.textContent = e.message; }
  // ---- its people and beasts, about whatever the hour has them about ----
  const life = RomanTownLife.create(town, { seed, date: clock() });
  window.life = life;
  // ---- and what is to be heard of it: off till asked for (browsers let
  // sound begin only from a click or a key); the more there is in view the
  // quieter each thing in it, the whole as loud however close one looks ----
  const sound = RomanTownSound.create(town, seed), soundBtn = document.getElementById('sound');
  function toggleSound() {
    const on = sound.toggle();
    soundBtn.textContent = `♪ sound: ${on ? 'on' : 'off'}`;
    soundBtn.setAttribute('aria-pressed', on);
  }
  soundBtn.addEventListener('click', toggleSound);
  function changed() { dirty = true; }
  // drawn again and again, for the wind and the flames, up to 30 times a
  // second; still while paused (P, or ?still)
  let last = 0, paused = new URLSearchParams(location.search).has('still'), before = performance.now(), lifeT = 0;
  function loop(now) {
    const dt = Math.max(0, (now - before) / 1000);
    if (!paused) { clockT += dt; lifeT += dt; }
    before = now;
    if (view && (dirty || (!paused && now - last > 32))) {
      dirty = false;
      last = now;
      // (the people on as often as they are drawn)
      if (lifeT > 0) { life.step(lifeT, clock()); lifeT = 0; }
      view.draw(viewRect(), sky, clockT, life);
      sound.update(life, seenRect(), sky, !paused);
      if (!started) {
        started = true;
        const t = clock(), hm = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
        hint.textContent = `town ${seed} · ${hm}, north up · ` + (touch ? 'drag: move · pinch: zoom · tap someone: who they are' : 'drag or arrows: move · wheel or + −: zoom · point at someone: who they are · 0: all · P: pause · M: sound · S: save PNG');
        showHint();
      }
    }
    requestAnimationFrame(loop);
  }

  // ---- moving about ----
  const devicePt = e => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * DW / r.width, (e.clientY - r.top) * DH / r.height];
  };
  const pointers = new Map();
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, devicePt(e));
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const p = devicePt(e);
    if (pointers.size === 1) {
      const q = pointers.get(e.pointerId);
      pan(p[0] - q[0], p[1] - q[1]);
    } else if (pointers.size === 2) {
      // a pinch: the zoom by how far apart the fingers are, about between them
      const [a, b] = [...pointers.values()], other = pointers.get(e.pointerId) === a ? b : a;
      const before = Math.hypot(a[0] - b[0], a[1] - b[1]), after = Math.hypot(p[0] - other[0], p[1] - other[1]);
      const q = pointers.get(e.pointerId);
      pan((p[0] - q[0]) / 2, (p[1] - q[1]) / 2);
      if (before > 10) zoomAt((p[0] + other[0]) / 2, (p[1] + other[1]) / 2, after / before);
    }
    pointers.set(e.pointerId, p);
  });
  const up = e => { pointers.delete(e.pointerId); if (!pointers.size) canvas.style.cursor = ''; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('dblclick', e => zoomAt(...devicePt(e), 2));
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
    zoomAt(...devicePt(e), Math.exp(-d * 0.0018));
  }, { passive: false });

  // ---- who someone is: pointed at (or tapped), their name, what they
  // are, what they are about, whether hungry or tired; the label kept by
  // them as they go ----
  const who = document.getElementById('who');
  let whoF = null, whoT = 0, whoUntil = 0;
  const THINGS = new Set(['meal', 'cart', 'boat', 'basket', 'stone', 'log', 'desk', 'trough', 'cage', 'woodpile']);
  function pickAt(px, py) {
    if (scale() < 5) return null;
    const [vx, vy] = viewRect(), wx = vx + px / scale(), wy = vy + py / scale(), r = Math.max(0.6, 16 * dpr / scale());
    let best = null, bd = r;
    for (const f of life.figures) {
      if (THINGS.has(f.kind)) continue;
      const d = Math.hypot(f.x - wx, f.y - wy) - (f.kind === 'person' ? 0.25 : 0);
      if (d < bd) { bd = d; best = f; }
    }
    return best;
  }
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function showWho(now) {
    if (!whoF || !whoF.vis || scale() < 5 || (whoUntil && now > whoUntil)) { who.style.display = 'none'; whoF = null; return; }
    if (now - whoT > 400) {
      whoT = now;
      const d = life.describe(whoF);
      if (!d) { who.style.display = 'none'; whoF = null; return; }
      who.innerHTML = `<b>${esc(d.name)}</b>${d.title ? `, ${esc(d.title)}` : ''}${d.doing ? `<br>${esc(d.doing)}` : ''}${d.needs ? ` · <i>${esc(d.needs)}</i>` : ''}`;
    }
    const r = canvas.getBoundingClientRect(), [vx, vy] = viewRect();
    const x = r.left + (whoF.x - vx) * scale() * r.width / DW, y = r.top + (whoF.y - vy) * scale() * r.height / DH;
    who.style.display = 'block';
    who.style.transform = `translate(${Math.min(innerWidth - who.offsetWidth - 6, x + 14)}px, ${Math.max(6, y - who.offsetHeight - 10)}px)`;
  }
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' || pointers.size) return;
    const f = pickAt(...devicePt(e));
    if (f !== whoF) { whoF = f; whoT = 0; whoUntil = 0; }
  });
  canvas.addEventListener('pointerleave', () => { if (!whoUntil) whoF = null; });
  // (a tap, on a touch screen: the label a while)
  let tapAt = null;
  canvas.addEventListener('pointerdown', e => { tapAt = [e.clientX, e.clientY, performance.now()]; });
  canvas.addEventListener('pointerup', e => {
    if (!tapAt || e.pointerType !== 'touch' || Math.hypot(e.clientX - tapAt[0], e.clientY - tapAt[1]) > 8 || performance.now() - tapAt[2] > 400) return;
    whoF = pickAt(...devicePt(e)); whoT = 0; whoUntil = performance.now() + 5000;
  });
  (function follow(now) { showWho(now); requestAnimationFrame(follow); })(performance.now());

  let lastMove = 0;
  window.addEventListener('mousemove', () => {
    const now = performance.now();
    if (now - lastMove > 500) { lastMove = now; showHint(); }
  });
  window.addEventListener('keydown', e => {
    // the screen's middle is the canvas's (it may be cropped on a phone)
    const step = Math.min(innerWidth, innerHeight) * dpr * 0.25;
    switch (e.key) {
      case 'ArrowLeft': pan(step, 0); break;
      case 'ArrowRight': pan(-step, 0); break;
      case 'ArrowUp': pan(0, step); break;
      case 'ArrowDown': pan(0, -step); break;
      case '+': case '=': zoomAt(DW / 2, DH / 2, 1.5); break;
      case '-': case '_': zoomAt(DW / 2, DH / 2, 1 / 1.5); break;
      case '0': zoom = 1; cx = W / 2; cy = H / 2; changed(); break;
      case 'p': case 'P': paused = !paused; break;
      case 'm': case 'M': if (!e.repeat) toggleSound(); break;
      case 's': case 'S': {
        const a = document.createElement('a');
        a.download = `roman-town-${seed}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        break;
      }
      default: return;
    }
    e.preventDefault();
  });
  let ht;
  function showHint() {
    hint.classList.remove('hidden');
    clearTimeout(ht);
    ht = setTimeout(() => hint.classList.add('hidden'), started ? 4000 : 60000);
  }

  if (view) { hint.textContent = 'laying out a town…'; showHint(); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
