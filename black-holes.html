<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Holes</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A small universe on a torus, black holes and dust and nothing but gravity, its mass-energy kept constant forever: dust falls in, holes merge, and evaporate back into dust.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1c1c; }
  canvas {
    display: block; position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%); cursor: pointer;
  }
  #hint {
    position: fixed; left: 16px; bottom: 14px; max-width: calc(100vw - 172px); /* (clear of the sound button) */
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border-radius: 4px;
    transition: opacity 1.2s; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
  #spectrum { height: 6px; width: 180px; margin-bottom: 5px; border-radius: 2px; }
  #sounds {
    position: fixed; right: 16px; bottom: 14px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  #sounds button {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border: 0; border-radius: 4px; cursor: pointer;
    transition: opacity 1.2s; opacity: 1;
  }
  #sounds.dim button { opacity: .35; }
  #sounds button:hover, #sounds button:focus-visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><div id="spectrum"></div><div id="hintText"></div></div>
<div id="sounds">
  <button id="waves" type="button" aria-pressed="false">∘ waves: off</button>
  <button id="sound" type="button" aria-pressed="false">♪ music: off</button>
</div>
<script src="pollock.js"></script>
<script src="black-holes.js"></script>
<script src="black-holes-music.js"></script>
<script>
(() => {
  const PD = PollockDreams;
  const canvas = document.getElementById('c');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');
  const spectrum = document.getElementById('spectrum');
  const sounds = document.getElementById('sounds');
  const musicButton = document.getElementById('sound');
  const wavesButton = document.getElementById('waves');

  const seed = (Math.random() * 1e9) | 0;
  const touch = matchMedia('(pointer: coarse)').matches;
  // the canvas (CW × CH css px) and the screen (VW × VH)
  let CW, CH, VW, VH;

  // ---- the universe ----
  // Its own time runs TIME times as fast as ours: light crosses the screen's
  // height in some seven seconds, dust in a quarter of a minute or so.
  const TIME = 0.05, MAX_STEP = 0.0012; // (its seconds: a frame's time is cut into steps no longer)
  // Each particle a short streak, back along the way it goes: STREAK css px
  // long when at rest, the full STREAK + STREAK_FAST at the speed of light.
  const STREAK = 3, STREAK_FAST = 2;
  // Colour: every particle glows as a hot body does, its light, at rest a
  // dull red, shifted towards the blue the faster it goes, as light from a
  // source coming nearer is, and towards the red, and dark, the deeper the
  // well it is in, as light climbing out of one is. A body's glow, shifted,
  // is a body's glow still, only hotter or cooler, so it is drawn as one of
  // T = T_REST·α·((1 + β)/(1 − β))^(KAPPA/2): red, orange, white, blue,
  // and past the bluest a body can be, violet. (The Doppler factor, squared:
  // the dust is never fast enough to show it at its true strength.)
  const T_REST = 1600, KAPPA = 2;
  const tempOf = (beta, alpha) => T_REST * alpha * Math.pow((1 + beta) / (1 - beta), KAPPA / 2);
  // a hot body's colour, sRGB 0–1 (after Tanner Helland's fit of the
  // Planckian locus), violet past 25 000 K
  function bodyColour(T) {
    const t = T / 100;
    const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
    const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
    let c = [r, g, b].map(v => Math.min(1, Math.max(0, v / 255)));
    const v = Math.min(1, Math.max(0, (T - 25000) / 35000)), w = v * v * (3 - 2 * v);
    return c.map((x, i) => x + ([0.62, 0.42, 1][i] - x) * w);
  }

  function setupCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    [CW, CH, VW, VH] = PD.canvasSize();
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    canvas.width = Math.round(CW * dpr);
    canvas.height = Math.round(CH * dpr);
  }

  // ---- drawing: WebGL2 ----
  const BODY = `
    // a hot body's colour, linear RGB (as bodyColour), dimming as it cools past red
    vec3 body(float T) {
      float t = T / 100.0;
      float r = t <= 66.0 ? 255.0 : 329.698727446 * pow(t - 60.0, -0.1332047592);
      float g = t <= 66.0 ? 99.4708025861 * log(t) - 161.1195681661 : 288.1221695283 * pow(t - 60.0, -0.0755148492);
      float b = t >= 66.0 ? 255.0 : t <= 19.0 ? 0.0 : 138.5177312231 * log(t - 10.0) - 305.0447927307;
      vec3 c = clamp(vec3(r, g, b) / 255.0, 0.0, 1.0);
      c = mix(c, vec3(0.62, 0.42, 1.0), smoothstep(25000.0, 60000.0, T));
      return pow(c, vec3(2.2)) * smoothstep(700.0, 1700.0, T);
    }`;

  function glPainter(gl, u) {
    function program(vs, fs) {
      const p = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, '#version 300 es\nprecision highp float;\n' + src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        gl.attachShader(p, s);
      }
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const loc = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); loc[name] = gl.getUniformLocation(p, name); }
      return { p, loc };
    }
    const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
    const half = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
    const MAXH = 24, MAXW = 12;

    // the trails: lines drawn into a buffer that fades
    const trail = [0, 1].map(() => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, half ? gl.RGBA16F : gl.RGBA8, W, H, 0, gl.RGBA, half ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
      for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
      const f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      return { t, f };
    });
    let cur = 0;

    // the potential's long range: a texture of α − 1 on the grid
    const phiTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, phiTex);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.REPEAT], [gl.TEXTURE_WRAP_T, gl.REPEAT]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    const phiData = new Float32Array(u.NX * u.NY);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const QUAD_VS = `in vec2 p; out vec2 uv; void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0, 1); }`;

    const fade = program(QUAD_VS, `in vec2 uv; uniform sampler2D T; uniform float k; out vec4 o;
      void main() { vec4 c = texture(T, uv) * k; o = max(c - vec4(${half ? '0.0' : '1.0 / 255.0'}), 0.0); }`);

    const lines = program(`in vec4 v; uniform vec2 L; out vec3 col;
      ${BODY}
      void main() {
        float beta = min(v.z, 0.995), alpha = v.w;
        col = body(${T_REST.toFixed(1)} * alpha * pow((1.0 + beta) / (1.0 - beta), ${(KAPPA / 2).toFixed(3)}));
        gl_Position = vec4(v.x / L.x * 2.0 - 1.0, 1.0 - v.y / L.y * 2.0, 0, 1);
      }`, `in vec3 col; uniform float gain; out vec4 o; void main() { o = vec4(col * gain, 1.0); }`);
    const lineBuf = gl.createBuffer();
    let lineData = new Float32Array(0);

    // the picture: the curved ground, the trails, the holes' shadows
    const show = program(QUAD_VS, `in vec2 uv; out vec4 o;
      uniform sampler2D T, P; uniform vec2 L; uniform float c2, A;
      uniform int nh, nw;
      uniform vec4 holes[${MAXH}]; // x, y, its weight Hg/c², its shadow's radius
      uniform vec2 rings[${MAXH}]; // its ringing, just merged: how far out of round, which way
      uniform vec4 waves[${MAXW}]; // x, y, how far it has run, how strong
      uniform float axes[${MAXW}]; // which way it stretches
      uniform float px; // a device px, in its units
      float erfc_(float x) {
        float t = 1.0 / (1.0 + 0.3275911 * x);
        return t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429)))) * exp(-x * x);
      }
      vec2 near(vec2 d) { return d - L * floor(d / L + 0.5); }
      void main() {
        vec2 x = vec2(uv.x, 1.0 - uv.y) * L;
        float phi = texture(P, x / L).r; // the grid's, over c²
        // the shadows: how far outside the nearest one (the outline ringing
        // just after a merger), two near one another drawn out and joined by
        // a neck, as their horizons are, before they are one
        float edge = 1e9;
        for (int k = 0; k < ${MAXH}; k++) {
          if (k >= nh) break;
          vec2 d = near(x - holes[k].xy);
          float r = length(d);
          phi -= holes[k].z * erfc_(r / (2.0 * A)) / sqrt(r * r + 2.25e-6) / c2;
          float th = atan(d.y, d.x);
          float e = r - holes[k].w * (1.0 + rings[k].x * cos(2.0 * (th - rings[k].y)));
          float kk = 0.9 * holes[k].w, hh = max(kk - abs(edge - e), 0.0) / kk; // (a smooth union)
          edge = min(edge, e) - hh * hh * kk * 0.25;
        }
        float shadow = smoothstep(-px, px, edge);
        // gravitational waves: space stretched one way and squeezed across,
        // by turns, two arms round from the pair that sent it; stretched,
        // the ground's light redshifted, squeezed, blueshifted
        float ripple = 0.0;
        for (int k = 0; k < ${MAXW}; k++) {
          if (k >= nw) break;
          vec2 d = near(x - waves[k].xy);
          float r = length(d), s = (r - waves[k].z) / 0.012, env = s / 2.2;
          ripple += waves[k].w * exp(-env * env) * cos(s * 2.6 - 2.0 * (atan(d.y, d.x) - axes[k]));
        }
        float alpha = 1.0 + phi;
        // curvature, as the redshift of the ground's light: grey where space
        // is flat, red where it isn't, the same light all over (the red as
        // bright as the grey: luminance, being linear, keeps between them)
        float z = clamp(1.0 - alpha, 0.0, 1.0);
        vec3 grey = vec3(0.0144), red = vec3(0.0144 / 0.2126, 0.0, 0.0), blue = vec3(0.0, 0.0, 0.0144 / 0.0722);
        vec3 ground = mix(grey, red, smoothstep(0.0, 0.6, z));
        ground = mix(ground, ripple > 0.0 ? red : blue, smoothstep(0.0, 0.35, abs(ripple)));
        vec3 dust = texture(T, uv).rgb;
        vec3 col = ground + (1.0 - exp(-dust * 1.6)) * 1.1;
        col *= shadow;
        o = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
      }`);

    function bindQuad(p) {
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      const a = gl.getAttribLocation(p.p, 'p');
      gl.enableVertexAttribArray(a);
      gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    }

    // Draw: the trails fade by keep, the dust's last moves are drawn into
    // them, and the whole shown.
    function draw(keep) {
      // fade
      gl.disable(gl.BLEND);
      gl.useProgram(fade.p); bindQuad(fade);
      gl.bindFramebuffer(gl.FRAMEBUFFER, trail[1 - cur].f);
      gl.viewport(0, 0, W, H);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[cur].t);
      gl.uniform1i(fade.loc.T, 0); gl.uniform1f(fade.loc.k, keep);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      cur = 1 - cur;

      // the dust, each a streak back along its last move
      const n = u.n, pxU = u.Ly / CH; // (a css px, in its units)
      if (lineData.length < n * 8) lineData = new Float32Array(Math.ceil(n * 1.3) * 8);
      let k = 0;
      for (let i = 0; i < n; i++) {
        const x1 = u.px[i], y1 = u.py[i];
        let dx = x1 - u.ox[i], dy = y1 - u.oy[i];
        dx -= u.Lx * Math.round(dx / u.Lx); dy -= u.Ly * Math.round(dy / u.Ly); // (across the torus's seam)
        const d = Math.hypot(dx, dy);
        if (!(d > 0)) continue;
        const b = u.be[i], a = u.al[i], L = (STREAK + STREAK_FAST * b) * pxU / d;
        lineData[k++] = x1 - dx * L; lineData[k++] = y1 - dy * L; lineData[k++] = b; lineData[k++] = a;
        lineData[k++] = x1; lineData[k++] = y1; lineData[k++] = b; lineData[k++] = a;
      }
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(lines.p);
      gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
      gl.bufferData(gl.ARRAY_BUFFER, lineData.subarray(0, k), gl.STREAM_DRAW);
      const av = gl.getAttribLocation(lines.p, 'v');
      gl.enableVertexAttribArray(av);
      gl.vertexAttribPointer(av, 4, gl.FLOAT, false, 0, 0);
      gl.uniform2f(lines.loc.L, u.Lx, u.Ly);
      gl.uniform1f(lines.loc.gain, 0.7);
      gl.drawArrays(gl.LINES, 0, k / 4);
      gl.disable(gl.BLEND);

      // the picture
      u.potential(phiData);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, phiTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, u.NX, u.NY, 0, gl.RED, gl.FLOAT, phiData);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.useProgram(show.p); bindQuad(show);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[cur].t);
      gl.uniform1i(show.loc.T, 0); gl.uniform1i(show.loc.P, 1);
      gl.uniform2f(show.loc.L, u.Lx, u.Ly);
      gl.uniform1f(show.loc.c2, u.c * u.c); gl.uniform1f(show.loc.A, u.A);
      gl.uniform1f(show.loc.px, u.Ly / H);
      const hs = u.holes.slice(0, MAXH), hv = new Float32Array(MAXH * 4);
      hs.forEach((h, j) => hv.set([h.x, h.y, h.Hg / (u.c * u.c), u.shadowOf(h)], j * 4));
      gl.uniform1i(show.loc.nh, hs.length); gl.uniform4fv(show.loc.holes, hv);
      // a hole just merged rings: its outline drawn out along the way the
      // two met, then across, and back, dying away (turned by its spin)
      const rv = new Float32Array(MAXH * 2), now = performance.now() / 1000;
      hs.forEach((h, j) => {
        const g = ringing.get(h.id);
        if (!g) return;
        const t = now - g.t;
        if (t > RING_LIFE) { ringing.delete(h.id); return; }
        rv[j * 2] = g.a * Math.exp(-t / RING_TAU) * Math.cos(TAU * t / RING_PERIOD);
        rv[j * 2 + 1] = g.axis + u.chiOf(h) * t * 2.0;
      });
      gl.uniform2fv(show.loc.rings, rv);
      const ws = u.ripples.slice(0, MAXW), wv = new Float32Array(MAXW * 4);
      // a wave's strain, as it shows: as the root of its energy over how far it has spread
      ws.forEach((w, j) => wv.set([w.x, w.y, w.R, Math.min(0.5, 1.8 * Math.sqrt(w.E / (u.c * u.c) / Math.max(w.R, 0.02)))], j * 4));
      gl.uniform1i(show.loc.nw, ws.length); gl.uniform4fv(show.loc.waves, wv);
      gl.uniform1fv(show.loc.axes, Float32Array.from({ length: MAXW }, (_, j) => ws[j] ? ws[j].axis || 0 : 0));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    // a merger: the hole it made rings
    const ringing = new Map();
    function merged(e) { ringing.set(e.hole, { t: performance.now() / 1000, a: 0.45, axis: e.axis }); }
    return { draw, merged };
  }
  const TAU = Math.PI * 2, RING_PERIOD = 0.7, RING_TAU = 0.9, RING_LIFE = 4; // (our seconds)

  // the colours, slow to fast, as a strip over the hint
  {
    const stops = [];
    for (let b = 0; b <= 0.951; b += 0.05) {
      const c = bodyColour(tempOf(b, 1)).map(v => Math.round(255 * v));
      stops.push(`rgb(${c}) ${(b / 0.95 * 100).toFixed(0)}%`);
    }
    spectrum.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
  }

  // ---- the sound of mergers ----
  // A merger is heard as its gravitational wave reaches the screen's edges,
  // as by two detectors there: the left ear when the wave gets to the left
  // edge, the right when to the right, so one near the left is heard there
  // first, and louder. The sound is a merger's own: a chirp, the pair going
  // round faster and faster, rising to the moment they are one, then the
  // new hole's ringing, dying away; the heavier the hole, the lower.
  // Under it all, music (black-holes-music.js): slow clusters of many
  // voices in canon, inspired by Ligeti's Lux Aeterna; its own switch.
  // Off until asked for (browsers only let sound start from a click or a
  // key press); it waits while the painting is paused.
  const Sound = (() => {
    let ac = null, out = null, on = false, musicOn = false, music = null, held = false; // (on: the mergers heard)
    const CHIRP = 1.4; // seconds
    const heard = []; // {t (its time it began), x, M, loud, left, right}
    function setup() {
      ac = new AudioContext();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;
      out = ac.createGain(); out.gain.value = 0.9;
      // a long soft room, from decaying noise
      const len = ac.sampleRate * 3, ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      const verb = ac.createConvolver(); verb.buffer = ir;
      const wet = ac.createGain(); wet.gain.value = 0.35;
      out.connect(comp); out.connect(verb); verb.connect(wet); wet.connect(comp);
      comp.connect(ac.destination);
      music = BlackHolesMusic.player(ac, comp, seed);
    }
    const sync = () => { if (!music) return; musicOn && !held ? music.play() : music.stop(); };
    // one ear's chirp, now, panned to it
    function chirp(M, loud, pan) {
      const t0 = ac.currentTime + 0.02;
      const fEnd = Math.max(55, Math.min(660, 150 * Math.pow(0.15 / M, 0.7))); // (its ringing)
      const IN = CHIRP, RING = 0.9; // seconds of the chirp, and of the ringing
      const panner = ac.createStereoPanner(); panner.pan.value = pan;
      panner.connect(out);
      for (const [mult, level] of [[1, 1], [2, 0.22], [3, 0.07]]) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(fEnd * mult / 5, t0);
        o.frequency.exponentialRampToValueAtTime(fEnd * mult * 0.8, t0 + IN * 0.85);
        o.frequency.exponentialRampToValueAtTime(fEnd * mult, t0 + IN);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(loud * level * 0.3, t0 + IN * 0.6);
        g.gain.exponentialRampToValueAtTime(loud * level, t0 + IN);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + IN + RING);
        o.connect(g); g.connect(panner);
        o.start(t0); o.stop(t0 + IN + RING + 0.05);
      }
    }
    return {
      // the mergers heard (waves), the music: either, or both, or neither
      set(waves, m) {
        on = waves; musicOn = m;
        const any = on || musicOn;
        if (any && !ac) setup();
        if (ac && any) ac.resume();
        sync();
        if (!on) heard.length = 0;
        if (!any && ac) setTimeout(() => { if (!on && !musicOn) ac.suspend(); }, 700);
      },
      // (the music holds while the painting is paused)
      hold(h) { held = h; sync(); },
      get on() { return on; },
      // a merger at x, its new hole M, its wave carrying e (of the universe's mass-energy)
      merged(u, x, M, e) {
        if (!on) return;
        const loud = Math.min(1, 0.25 + 3 * Math.sqrt(e / (u.c * u.c)));
        heard.push({ t: u.time, x, M, loud, left: false, right: false });
      },
      // each frame: the wave fronts that have got to an edge are heard there
      listen(u) {
        if (!on) return;
        for (let k = heard.length - 1; k >= 0; k--) {
          // (its chirp begins as much ahead of the front as it lasts, so that
          // it peaks, the two one, just as the front is there)
          const w = heard[k], R = (u.time - w.t) * u.c + CHIRP * u.c * TIME;
          for (const [side, d, pan] of [['left', w.x, -0.85], ['right', u.Lx - w.x, 0.85]]) {
            if (w[side] || R < d) continue;
            w[side] = true;
            chirp(w.M, w.loud / Math.sqrt(1 + d / 0.4), pan);
          }
          if (w.left && w.right) heard.splice(k, 1);
        }
      },
    };
  })();
  // Two switches, as in the other paintings: the waves (mergers heard) and
  // the music, which comes with them: music on, the waves too; waves off,
  // the music too.
  let musicOn = false, wavesOn = false;
  function setSound(m, w) {
    musicOn = m; wavesOn = w || m;
    Sound.set(wavesOn, musicOn);
    musicButton.textContent = `♪ music: ${musicOn ? 'on' : 'off'}`;
    musicButton.setAttribute('aria-pressed', musicOn);
    wavesButton.textContent = `∘ waves: ${wavesOn ? 'on' : 'off'}`;
    wavesButton.setAttribute('aria-pressed', wavesOn);
    showHint();
  }
  const toggleMusic = () => setSound(!musicOn, wavesOn);
  const toggleWaves = () => setSound(musicOn && !wavesOn, !wavesOn);
  musicButton.addEventListener('click', toggleMusic);
  wavesButton.addEventListener('click', toggleWaves);

  let paused = false, uni = null;
  function showStats() {
    if (!uni) return;
    const E = uni.energy / (uni.c * uni.c);
    hintText.textContent = `holes ${uni.holes.length} · dust ${uni.n} · mass-energy ${uni.target === null ? '—' : E.toFixed(3)}` +
      (paused ? ' · paused' : '') +
      (touch ? ` · tap: ${paused ? 'resume' : 'pause'}` : ` · slow ← colour → fast · click: ${paused ? 'resume' : 'pause'} · M: music · W: waves · S: save PNG`);
  }

  // Click / tap pauses and resumes; while paused the hint stays up. The
  // screen is kept awake while it runs, as for a video.
  const awake = PD.screenAwake();
  canvas.addEventListener('click', () => {
    if (!uni) return;
    paused = !paused;
    Sound.hold(paused);
    awake(!paused);
    showStats();
    showHint();
  });

  // One universe per page load: it is never restarted, only reloading the
  // page begins a new one.
  function start() {
    setupCanvas();
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true });
    if (!gl) { hintText.textContent = 'This painting needs WebGL2.'; return; }
    // The universe is as big whatever the screen's shape, as a 16:9 one's
    // (16/9 × 1): only its shape is the screen's, a tall narrow one as tall
    // and narrow; so it holds the same, and behaves the same, everywhere.
    const aspect = CW / CH, Ly = Math.sqrt(16 / 9 / aspect), Lx = aspect * Ly;
    // its grid: the fewest cells (powers of two each way) no coarser than a
    // 16:9 screen's (256 × 128), so its gravity is as fine whatever the shape
    // (cells much longer one way than the other soften it, and it calms)
    const grid = (Lx, Ly) => {
      let best = null;
      for (let i = 5; i <= 10; i++) for (let j = 5; j <= 10; j++) {
        const NX = 2 ** i, NY = 2 ** j, size = Math.max(Lx / NX, Ly / NY);
        if (size > 1.05 / 128) continue;
        if (!best || NX * NY < best.NX * best.NY || (NX * NY === best.NX * best.NY && size < best.size)) best = { NX, NY, size };
      }
      return { NX: best.NX, NY: best.NY };
    };
    const u = uni = BlackHoles.universe(PD.mulberry32(seed), {
      Lx, Ly, ...grid(Lx, Ly), 
      N: touch ? 9000 : 15000,
    });
    window.universe = u; // (for whoever wants to look inside: the scripts that paint its previews)
    const painter = glPainter(gl, u);
    painter.draw(1);
    showStats();
    showHint();
    awake(true);
    let last, statsAt = 0;
    // time spent in a hidden tab, or while paused, doesn't pile up into a
    // burst when it comes back
    const frame = now => {
      const dt = Math.min(100, now - (last ?? now)) / 1000;
      last = now;
      if (!paused && dt > 0) {
        const T = dt * TIME, steps = Math.ceil(T / MAX_STEP);
        for (let s = 0; s < steps; s++) {
          u.step(T / steps);
          for (const e of u.events) if (e.type === 'merge') { painter.merged(e); Sound.merged(u, e.x, e.M, e.e); }
        }
        painter.draw(0); // (each frame anew)
        Sound.listen(u);
        if (now - statsAt > 500) { statsAt = now; showStats(); }
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // the hint (with the totals) comes back while the mouse moves
  let lastMove = 0;
  window.addEventListener('mousemove', () => {
    const now = performance.now();
    if (now - lastMove > 500) { lastMove = now; showHint(); }
  });
  window.addEventListener('keydown', e => {
    if ((e.key === 'm' || e.key === 'M') && !e.repeat) toggleMusic();
    if ((e.key === 'w' || e.key === 'W') && !e.repeat) toggleWaves();
    if ((e.key === 's' || e.key === 'S') && uni) {
      const a = document.createElement('a');
      a.download = `black-holes-${seed}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  });
  let ht;
  function showHint() {
    hint.classList.remove('hidden');
    sounds.classList.remove('dim');
    clearTimeout(ht);
    if (!paused) ht = setTimeout(() => { hint.classList.add('hidden'); sounds.classList.add('dim'); }, 4000);
  }

  start();
})();
</script>
</body>
</html>
