<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pollock Dreams</title>
<meta name="description" content="Endless generative drip paintings in the spirit of Jackson Pollock. Click for a new one.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pollock Dreams">
<meta property="og:title" content="Pollock Dreams">
<meta property="og:description" content="Endless generative drip paintings in the spirit of Jackson Pollock. Click for a new one.">
<meta property="og:url" content="https://kefirfromperm.github.io/pollock-dreams/">
<meta property="og:image" content="https://kefirfromperm.github.io/pollock-dreams/og/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="“Pollock Dreams” written in poured cursive lines over a generative drip painting">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Pollock Dreams">
<meta name="twitter:description" content="Endless generative drip paintings in the spirit of Jackson Pollock. Click for a new one.">
<meta name="twitter:image" content="https://kefirfromperm.github.io/pollock-dreams/og/og.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9c7a3; }
  canvas {
    display: block; position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%); cursor: pointer;
    touch-action: none; /* swipes are ours, not scroll / pull-to-refresh */
  }
  #hint {
    position: fixed; left: 16px; bottom: 14px;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f4efe3; background: rgba(20,17,15,.55);
    padding: 6px 10px; border-radius: 4px;
    transition: opacity 1.2s; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click / space: new painting · S: save PNG</div>
<script src="pollock.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  let seed, token = 0, W, H;
  const DRAW_MS = 5000;
  const touch = matchMedia('(pointer: coarse)').matches;

  function readSeed() {
    const m = location.hash.match(/^#(\d+)$/);
    return m ? +m[1] : (Math.random() * 1e9) | 0;
  }
  // At most one new painting per second: rapid full-screen changes can
  // trigger photosensitive epilepsy. Extra requests are dropped, not queued.
  let lastNew = -Infinity;
  function newSeed() {
    const now = performance.now();
    if (now - lastNew < 1000) return;
    lastNew = now;
    seed = (Math.random() * 1e9) | 0;
    history.replaceState(null, '', '#' + seed);
    start();
  }

  function setupCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // Paint at the largest size the window can reach (the screen), so resizing
    // only reveals or crops the same image instead of repainting it.
    W = Math.max(screen.width, window.innerWidth);
    H = Math.max(screen.height, window.innerHeight);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function start() {
    const my = ++token;
    setupCanvas();
    const rng = PollockDreams.mulberry32(seed);
    const { jobs, bg, name } = PollockDreams.engine(ctx, W, H).buildJobs(rng);
    document.body.style.background = bg;
    showHint(touch ? `after ${name} · tap / swipe: new`
                   : `after ${name} · click / space: new · S: save PNG`);
    // Spread the drawing over at least DRAW_MS whatever the device speed:
    // a fast machine would otherwise pile up the alternating dark and light
    // layers in under a second, close to the 3 flashes/s seizure threshold.
    let i = 0, t0;
    const frame = now => {
      if (my !== token) return;
      t0 ??= now;
      const due = Math.min(jobs.length, 1 + Math.ceil((jobs.length - 1) * (now - t0) / DRAW_MS));
      const f0 = performance.now();
      while (i < due && performance.now() - f0 < 14) jobs[i++]();
      if (i < jobs.length) requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('click', newSeed);
  // Swipe in any direction for a new painting (tap is handled by click).
  let swipe = null;
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') swipe = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', e => {
    if (!swipe || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.hypot(dx, dy) > 50) newSeed();
  });
  canvas.addEventListener('pointercancel', () => { swipe = null; });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === 'n') {
      e.preventDefault();
      if (!e.repeat) newSeed(); // holding the key doesn't keep redrawing
    }
    if (e.key === 's' || e.key === 'S') {
      const a = document.createElement('a');
      a.download = `pollock-${seed}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  });
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    // only repaint if the window outgrew the painting (e.g. moved to a bigger monitor)
    rt = setTimeout(() => { if (window.innerWidth > W || window.innerHeight > H) start(); }, 250);
  });
  window.addEventListener('hashchange', () => { const s = readSeed(); if (s !== seed) { seed = s; start(); } });
  let ht;
  function showHint(text) {
    hint.textContent = text;
    hint.classList.remove('hidden');
    clearTimeout(ht);
    ht = setTimeout(() => hint.classList.add('hidden'), 4000);
  }

  seed = readSeed();
  history.replaceState(null, '', '#' + seed);
  start();
})();
</script>
</body>
</html>
