<style>
  @font-face {
    font-family: 'Mr Dafoe';
    src: url(og/fonts/MrDafoe-Regular.ttf) format('truetype');
    font-display: swap;
  }
  :root {
    --wall: #e9e4da;
    --wall-deep: #d8d1c3;
    --floor: #b9ab93;
    --light: rgba(255, 250, 236, .75);
    --ink: #2b2620;
    --muted: #6f665a;
    --frame: #1d1a17;
    --mat: #f6f2ea;
    --placard: #fbf9f4;
    --shadow: rgba(40, 30, 15, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wall: #2a2724;
      --wall-deep: #1b1917;
      --floor: #12100f;
      --light: rgba(255, 236, 200, .16);
      --ink: #efe9df;
      --muted: #a69c8e;
      --frame: #0c0b0a;
      --mat: #ece6da;
      --placard: #34302b;
      --shadow: rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --wall: #2a2724;
    --wall-deep: #1b1917;
    --floor: #12100f;
    --light: rgba(255, 236, 200, .16);
    --ink: #efe9df;
    --muted: #a69c8e;
    --frame: #0c0b0a;
    --mat: #ece6da;
    --placard: #34302b;
    --shadow: rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  html { background: var(--floor); }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    color: var(--ink);
    font: 16px/1.5 Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    /* the wall, darker towards the floor, with a skirting line at the bottom */
    background:
      linear-gradient(to bottom, var(--wall) 0%, var(--wall) 55%, var(--wall-deep) calc(100% - 64px),
                      var(--floor) calc(100% - 64px), var(--floor) 100%);
  }

  header { text-align: center; padding: 56px 16px 8px; }
  h1 {
    margin: 0;
    font: 400 clamp(44px, 9vw, 84px)/1 'Mr Dafoe', 'Brush Script MT', cursive;
    letter-spacing: .01em;
  }
  header p {
    margin: 10px 0 0;
    font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: clamp(48px, 9vw, 120px);
    padding: 64px 16px 112px;
    overflow-x: clip; /* the spotlights are wider than a phone */
  }

  .work { position: relative; width: min(340px, 100%); }
  /* a ceiling spot on each painting */
  .work::before {
    content: ''; position: absolute; z-index: -1;
    left: 50%; top: -90px; width: 170%; height: 135%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse 50% 50% at 50% 38%, var(--light), transparent 70%);
    pointer-events: none;
    transition: opacity .6s;
    opacity: .8;
  }
  .work:hover::before, .work:focus-within::before { opacity: 1; }

  .frame {
    display: block;
    padding: 14px;
    background: var(--frame);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      0 2px 3px var(--shadow),
      0 22px 40px -12px var(--shadow);
    transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s;
  }
  .frame:hover, .frame:focus-visible {
    transform: translateY(-4px);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      0 4px 6px var(--shadow),
      0 34px 54px -14px var(--shadow);
  }
  .frame:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
  .mat {
    display: block;
    padding: clamp(18px, 8%, 30px);
    background: var(--mat);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.25);
  }
  .mat img {
    display: block; width: 100%; height: auto; aspect-ratio: 4 / 5;
    box-shadow: 0 0 0 1px rgba(0,0,0,.12);
  }

  .placard {
    margin: 32px auto 0; width: 82%;
    padding: 14px 16px 15px;
    background: var(--placard);
    box-shadow: 0 1px 2px var(--shadow);
    font-size: 13px; line-height: 1.5;
  }
  .placard h2 { margin: 0; font-size: 17px; font-weight: 400; font-style: italic; }
  .placard h2 a { color: inherit; text-decoration: none; }
  .placard h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .placard .medium { margin: 2px 0 8px; color: var(--muted); }
  .placard p { margin: 0; }

  footer {
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 16px; min-height: 64px;
    font-size: 12px; color: #f4efe3; opacity: .75;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>Digital Art Meditation</h1>
  <p>Immersive visuals for a calm mind</p>
</header>

<main>
  <figure class="work" style="margin:0">
    <a class="frame" href="pollock-dreams.html" aria-label="Pollock Dreams">
      <span class="mat"><img src="previews/pollock-dreams.jpg" width="800" height="1000"
        alt="A dense generative drip painting of yellow, white, red and black poured lines"></span>
    </a>
    <figcaption class="placard">
      <h2><a href="pollock-dreams.html">Pollock Dreams</a></h2>
      <div class="medium">Generative drip painting, endless · with music</div>
      <p>One drip painting that never stops being poured, its colours drifting from one Pollock combination to the next.</p>
    </figcaption>
  </figure>

  <figure class="work" style="margin:0">
    <a class="frame" href="rectangles.html" aria-label="Rectangle Dreams">
      <span class="mat"><img src="previews/rectangles.jpg" width="800" height="1000"
        alt="Generative rectangles of ochre, lilac, pink and blue glazed one over another"></span>
    </a>
    <figcaption class="placard">
      <h2><a href="rectangles.html">Rectangle Dreams</a></h2>
      <div class="medium">Generative glazes, endless · with music</div>
      <p>Fractal rectangles glazed one over another forever, their colours walking around the whole colour wheel in harmony.</p>
    </figcaption>
  </figure>
</main>

<footer>
  <span>Also in the collection: <a href="pollock-static.html">Pollock Dreams: Static</a>, a new drip painting with every click.</span>
</footer>
</body>
